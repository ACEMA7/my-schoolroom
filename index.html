                var arrowEl=document.getElementById(p+'arrow-'+dorm.floorId);
                if(arrowEl) arrowEl.textContent='▼';
            });
            renderHierarchyView(document.getElementById('contentArea'));
            if (window.innerWidth <= 768) closeSidebar();
        }
    }

    // ==================== 住宿信息视图 ====================
    function renderHierarchyView(container){
        var isMobileH=window.innerWidth<=768;
        var classMode=isClassAdmin();
        var classDormSet=classMode?getClassDormIds():null;
        // 若当前选中的宿舍已被删除（不在 dormitoryList），清空选择重新定位
        var selDorm = selectedDormitoryId ? getDormitoryById(selectedDormitoryId) : null;
        if(selDorm && isDormitoryDeleted(selDorm.roomNumber)){ selectedDormitoryId=null; selectedFloorId=null; selDorm=null; }
        if(!selectedDormitoryId||!getDormitoryById(selectedDormitoryId)||(classMode&&!classDormSet[selectedDormitoryId])){
            // 手机端/班级账号：默认选中第一个可用楼层的第一个宿舍；桌面端保持原有默认逻辑
            var firstDorm=null;
            if(isMobileH||classMode){
                var floorsPool=DB.floors;
                if(classMode){
                    floorsPool=DB.floors.filter(function(f){
                        return getDormitoriesByFloor(f.id).some(function(d){ return classDormSet[d.id]; });
                    });
                }
                var f0=floorsPool[0];
                var dorms0=f0?getDormitoriesByFloor(f0.id):[];
                if(classMode) dorms0=dorms0.filter(function(d){ return classDormSet[d.id]; });
                firstDorm=dorms0.length?dorms0[0]:null;
            }else{
                firstDorm=DB.dormitories[0];
            }
            if(firstDorm){
                selectedDormitoryId=firstDorm.id;
                selectedFloorId=firstDorm.floorId;
            }else if(classMode){
                container.innerHTML='<div class="content-header"><h2>📋 住宿信息</h2></div><div class="empty-state">该班级暂无学生入住数据</div>';
                return;
            }
        }
        if(!selectedDormitoryId){container.innerHTML='<div class="empty-state">暂无数据</div>';return;}
        var dorm=getDormitoryById(selectedDormitoryId);
        var floor=getFloorById(dorm.floorId);
        var students=getStudentsByDormitory(dorm.id);
        // 班级账号：成员仅显示本班学生（合住宿舍中其他班级学生不显示）
        if(classMode) students=students.filter(function(s){ return s.className===currentUser.className; });
        var records=getRecordsByDormitory(dorm.id);
        // 班级账号：仅显示本班学生的记录及本班宿舍的集体记录
        if(classMode) records=filterRecordsByClass(records);
        var total=getTotalScore(records);
        // 汇总当前宿舍各状态人数（与成员列表状态标签同一套优先级逻辑，每次渲染实时计算）
        var statusOrder=['在住','请假中','停宿中','退宿申请中','已退宿']; // 按需求移除"停宿申请中"统计项
        var statusColorMap={'在住':'#34c759','请假中':'#4f6ef7','停宿中':'#a855f7','退宿申请中':'#ff9500','停宿申请中':'#ff9500','已退宿':'#ff3b30'};
        var statusCounts={}; statusOrder.forEach(function(k){ statusCounts[k]=0; });
        students.forEach(function(s){ var st=getStudentStatus(s.id); if(statusCounts[st.label]!==undefined) statusCounts[st.label]++; });
        var statusRowHtml=statusOrder.map(function(k){
            return '<span style="display:inline-flex;align-items:center;gap:6px;font-size:0.9286rem;font-weight:600;color:var(--gray-700)"><span style="width:10px;height:10px;border-radius:50%;background:'+statusColorMap[k]+';flex-shrink:0"></span>'+k+': '+statusCounts[k]+'人</span>';
        }).join('');
        var studentHtml=students.map(function(s){
            var sr=records.filter(function(r){return r.studentId===s.id;});
            var ss=getTotalScore(sr);
            var st=getStudentStatus(s.id);
            var ops = '';
            if(isAdmin()){
                ops = '<td data-label="操作"><button class="btn btn-outline btn-xs" onclick="openTransferModal('+s.id+')">调宿</button> <button class="btn btn-danger btn-xs" onclick="moveOutStudent('+s.id+')">迁出</button></td>';
            }
            return '<tr><td data-label="姓名"><b>'+s.name+'</b></td><td data-label="班级">'+(s.className||'-')+'</td><td data-label="床号">'+(s.bedNumber||'-')+'</td><td data-label="状态"><span class="status-tag '+st.cls+'">'+st.label+'</span></td><td data-label="个人扣分" class="'+(ss>0?'highlight-red':'')+'">'+ss+'</td>'+ops+'</tr>';
        }).join('')||'<tr><td colspan="5" style="text-align:center;color:#aaa">该宿舍暂无成员</td></tr>';
        // 移动端成员单行紧凑列表：姓名 + 彩色圆点状态（圆点与文字同色）+ 班级·床号，右侧个人扣分（0分绿色/有分红色）
        var memberCardHtml=students.map(function(s){
            var sr=records.filter(function(r){return r.studentId===s.id;});
            var ss=getTotalScore(sr);
            var st=getStudentStatus(s.id);
            var dotColor=statusColorMap[st.label]||'#9ca3af';
            var memOps = '';
            if(isAdmin()){
                memOps = '<span class="mem-ops"><button class="btn btn-outline btn-xs" style="padding:2px 6px;font-size:0.7857rem" onclick="openTransferModal('+s.id+')">调宿</button><button class="btn btn-danger btn-xs" style="padding:2px 6px;font-size:0.7857rem" onclick="moveOutStudent('+s.id+')">迁出</button></span>';
            }
            return '<div class="mem-row"><span class="mem-name">'+s.name+'</span><span class="mem-status" style="color:'+dotColor+'"><span class="mem-dot" style="background:'+dotColor+'"></span>'+st.label+'</span><span class="mem-sub">'+(s.className||'-')+'·床号'+(s.bedNumber||'-')+'</span><span class="mem-score'+(ss>0?' has':'')+'">'+ss+'分</span>'+memOps+'</div>';
        }).join('')||'<div class="empty-state" style="padding:18px">该宿舍暂无成员</div>';
        // 按日期倒序排列：当天记录显示在最顶部（同日内较新记录优先；兼容字符串ID与旧数字ID）
        var sortedRecords=records.slice().sort(function(a,b){
            if(a.recordDate!==b.recordDate) return a.recordDate<b.recordDate?1:-1;
            var ta=a.createdAt||0, tb=b.createdAt||0;
            if(ta!==tb) return tb-ta;
            return String(b.id)<String(a.id)?-1:(String(b.id)>String(a.id)?1:0);
        });
        var isStaff=currentUser&&currentUser.role==='STAFF';
        var recordHtml=sortedRecords.length>0?sortedRecords.map(function(r){
            var student=r.studentId?getStudentById(r.studentId):null;
            var hyNames=(r.hygieneItemIds||[]).map(getItemNameByIdOrCustom).filter(Boolean).join('、');
            var disNames=(r.disciplineItemIds||[]).map(getItemNameByIdOrCustom).filter(Boolean).join('、');
            // 操作列：管理员可删除，生活老师（STAFF）可修改，其他角色无操作（ID为字符串需加引号传参）
            var actionHtml='<td data-label="操作">-</td>';
            if(isAdmin()) actionHtml='<td data-label="操作"><button class="btn btn-danger btn-xs" onclick="deleteRecord(\''+r.id+'\')">删除</button></td>';
            else if(isStaff) actionHtml='<td data-label="操作"><button class="btn btn-primary btn-xs" onclick="editRecord(\''+r.id+'\')">修改</button></td>';
            return '<tr><td data-label="日期">'+r.recordDate+'</td><td data-label="对象">'+(student?student.name:'宿舍集体')+'</td><td data-label="卫生项目">'+(hyNames||'-')+'</td><td data-label="卫生扣分">'+(r.hygieneScore||0)+'</td><td data-label="纪律项目">'+(disNames||'-')+'</td><td data-label="纪律扣分">'+(r.disciplineScore||0)+'</td><td data-label="备注">'+escapeHtmlAttr(r.remark||'-')+'</td>'+actionHtml+'</tr>';
        }).join(''):'<tr><td colspan="8" style="text-align:center;color:#aaa">暂无记录</td></tr>';
        // 手机端顶部导航卡：楼层芯片(每行4个均匀分布) + 宿舍横滑条，与扣分登记页交互一致；桌面端不渲染（侧边栏树保留）
        var topCard='';
        if (window.innerWidth<=768) {
            var floorsList=DB.floors;
            var dormsOfFloor=getDormitoriesByFloor(dorm.floorId);
            // 班级账号：仅显示本班学生入住的楼层与宿舍
            if(classMode){
                floorsList=DB.floors.filter(function(f){
                    return getDormitoriesByFloor(f.id).some(function(d){ return classDormSet[d.id]; });
                });
                dormsOfFloor=dormsOfFloor.filter(function(d){ return classDormSet[d.id]; });
            }
            var floorChips=floorsList.map(function(f){
                return '<div class="chip'+(f.id===dorm.floorId?' active':'')+'" onclick="hierarchyPickFloor('+f.id+')">'+f.name+'</div>';
            }).join('');
            var dormChips=dormsOfFloor.map(function(r){
                return '<div class="chip'+(r.id===dorm.id?' active':'')+'" onclick="hierarchyPickDorm('+r.id+')">'+r.roomNumber+'</div>';
            }).join('')||'<span style="color:#aaa;font-size:0.9286rem">该楼层暂无宿舍</span>';
            topCard='<div class="card"><div class="card-body">'
                +'<div class="form-group"><label>🏢 选择楼层</label><div class="chip-floors'+(classMode?' chip-floors-left':'')+'">'+floorChips+'</div></div>'
                +'<div class="form-group" style="margin-bottom:0"><label>🚪 选择宿舍号 <span style="font-weight:400;font-size:0.8571rem;color:var(--gray-500)">左右滑动查看更多</span></label><div class="chip-dorms">'+dormChips+'</div></div>'
                +'</div></div>';
        }
        // 三个统计卡片内容（宿舍人数/扣分记录数/累计扣分）：PC 端合并在统计大卡内；移动端移至成员列表下方
        var statThreeInner='<div class="stat-card"><div class="number">'+students.length+'</div><div class="label">👥 宿舍人数</div></div><div class="stat-card warning"><div class="number">'+records.length+'</div><div class="label">📋 扣分记录数</div></div><div class="stat-card danger"><div class="number">'+total+'</div><div class="label">📊 累计扣分</div></div>';
        // PC 端宿舍信息统计大卡：状态汇总行 + 三张统计卡片（保持原样）
        var statsCard='<div class="card"><div class="card-header">📊 宿舍信息统计</div><div class="card-body">'
            +'<div style="display:flex;flex-wrap:wrap;gap:8px 18px;padding:10px 14px;background:var(--gray-50);border-radius:6px;margin-bottom:14px">'+statusRowHtml+'</div>'
            +'<div class="stat-cards" style="margin-bottom:0">'+statThreeInner+'</div>'
            +'</div></div>';
        // 移动端：状态汇总单独成卡（三张统计卡下移到成员列表之后、历史记录之前），使用独立 .stat-cards-mobile 类避免与其他 stat-cards 冲突
        var statusCard='<div class="card"><div class="card-header">📊 宿舍信息统计</div><div class="card-body">'
            +'<div style="display:flex;flex-wrap:wrap;gap:8px 18px;padding:10px 14px;background:var(--gray-50);border-radius:6px">'+statusRowHtml+'</div>'
            +'</div></div>';
        var statThreeMobile='<div class="stat-cards-mobile"><div class="stat-item"><div class="number">'+students.length+'</div><div class="label">👥 宿舍人数</div></div><div class="stat-item"><div class="number" style="color:#f59e0b">'+records.length+'</div><div class="label">📋 扣分记录数</div></div><div class="stat-item"><div class="number" style="color:#ff3b30">'+total+'</div><div class="label">📊 累计扣分</div></div></div>';
        // 页头仅保留标题（登记扣分入口统一收敛到功能首页/侧边栏/底部导航，住宿信息页只读）
        var memberOpsTh = isAdmin() ? '<th>操作</th>' : '';
        var membersCardPc='<div class="card"><div class="card-header">👥 宿舍成员</div><div style="overflow-x:auto"><table><thead><tr><th>姓名</th><th>班级</th><th>床号</th><th>状态</th><th>个人扣分</th>'+memberOpsTh+'</tr></thead><tbody>'+studentHtml+'</tbody></table></div></div>';
        var membersCardMobile='<div class="card"><div class="card-header">👥 宿舍成员</div><div class="card-body" style="padding:2px 14px">'+memberCardHtml+'</div></div>';
        var recordsCard='<div class="card"><div class="card-header">📜 历史扣分记录 <span class="badge-tag badge-danger">'+total+'分</span><span style="font-weight:400;font-size:0.8571rem;color:var(--gray-500);margin-left:6px">按日期倒序</span></div><div style="overflow-x:auto"><table><thead><tr><th>日期</th><th>对象</th><th>卫生扣分</th><th>分值</th><th>纪律扣分</th><th>分值</th><th>备注</th><th>操作</th></tr></thead><tbody>'+recordHtml+'</tbody></table></div></div>';
        // 移动端顺序：楼层/宿舍芯片 → 状态汇总 → 宿舍成员（单行紧凑）→ 三个统计卡片 → 历史扣分记录
        // PC 端顺序保持不变：统计大卡（状态+三卡片）→ 历史扣分记录 → 宿舍成员表
        container.innerHTML='<div class="content-header"><h2>📋 宿舍 '+dorm.roomNumber+'（'+floor.name+'）</h2></div>'+topCard+(isMobileH?(statusCard+membersCardMobile+statThreeMobile+recordsCard):(statsCard+recordsCard+membersCardPc));
    }

    // ==================== 手机端住宿信息：芯片选择器 ====================
    // 选择楼层：宿舍条更新为该楼层宿舍并自动选中第一个，随后刷新数据区
    function hierarchyPickFloor(fid){
        selectedFloorId=fid;
        var dorms=getDormitoriesByFloor(fid);
        // 班级账号：仅在本班学生入住的宿舍中选择
        if(isClassAdmin()){
            var dormSet=getClassDormIds();
            dorms=dorms.filter(function(d){ return dormSet[d.id]; });
        }
        selectedDormitoryId=dorms.length?dorms[0].id:null;
        refreshHierarchyData();
    }
    // 选择宿舍：更新选中宿舍并刷新数据区
    function hierarchyPickDorm(id){
        selectedDormitoryId=id;
        refreshHierarchyData();
    }
    // 数据区刷新（本地数据同步渲染，无需加载状态）
    function refreshHierarchyData(){
        renderHierarchyView(document.getElementById('contentArea'));
        var c=document.getElementById('contentArea');
        if(c) c.scrollTop=0;
        // 宿舍横向条自动滚动到选中项
        var actChip=document.querySelector('.chip-dorms .chip.active');
        if(actChip&&actChip.scrollIntoView){try{actChip.scrollIntoView({inline:'center',block:'nearest'});}catch(e){}}
    }
    function deleteRecord(id){
        if(!isAdmin()){toast('无权限操作','error');return;}
        if(!confirm('确认删除？')) return;
        DB.deductionRecords=DB.deductionRecords.filter(function(r){return String(r.id)!==String(id);});
        // 登记删除墓碑：防止该记录在下次拉取时从云端回灌（saveDB 全量上传时云端同步剔除）
        if(DB.deletedRecordIds.indexOf(String(id))===-1) DB.deletedRecordIds.push(String(id));
        // V3 按行存储：标记删除
        v3MarkDeleted('deduction_record', id);
        saveDB();
        toast('已删除');
        renderView();
        renderTree();
    }

    // ==================== 学生迁出 / 调宿（仅管理员） ====================
    var transferStudentId = null;
    function moveOutStudent(studentId){
        if(!isAdmin()){toast('无权限操作','error');return;}
        var s = getStudentById(studentId);
        if(!s){toast('学生不存在','error');return;}
        var dorm = getDormitoryById(s.dormitoryId);
        var dormLabel = dorm ? dorm.roomNumber : '未分配';
        if(!confirm('确定将 '+s.name+' 迁出 '+dormLabel+' 吗？\n（迁出后该学生将保留在系统中，可在学生名单管理中重新分配宿舍）')) return;
        s.dormitoryId = null;
        s.bedNumber = '';
        // V3 按行存储：学生迁出修改，标记脏记录
        v3MarkDirty('student', studentId);
        saveDB();
        toast(s.name+' 已迁出');
        renderView();
        renderTree();
    }
    function openTransferModal(studentId){
        if(!isAdmin()){toast('无权限操作','error');return;}
        var s = getStudentById(studentId);
        if(!s){toast('学生不存在','error');return;}
        transferStudentId = studentId;
        var curDorm = getDormitoryById(s.dormitoryId);
        var curRoom = curDorm ? curDorm.roomNumber : '未分配';
        // 目标宿舍：所有生效宿舍号（排除当前宿舍）
        var allActiveDorms = (DB.dormitories||[]).filter(function(d){ return isDormitoryDeleted(d.roomNumber)===false; });
        allActiveDorms.sort(function(a,b){ return String(a.roomNumber).localeCompare(String(b.roomNumber),'zh-Hans-CN',{numeric:true}); });
        var dormOpts = allActiveDorms.map(function(d){
            var selected = (curDorm && d.id===curDorm.id) ? ' selected' : '';
            var fl = getFloorById(d.floorId);
            return '<option value="'+d.id+'"'+selected+'>'+d.roomNumber+'（'+(fl?fl.name:'未分配楼层')+'）</option>';
        }).join('');
        var bedOpts = '';
        // 初始床位选项：当前宿舍的床位（含当前学生自身床位）
        if(curDorm){
            bedOpts = buildBedOptions(curDorm.id, s.id);
        }
        var html = '<div class="em-header"><span>🔄 调换床位/宿舍</span><button class="em-close" aria-label="关闭" onclick="closeTransferModal()">✕</button></div>'
            + '<div class="em-body">'
            + '<div class="form-group"><label>当前信息</label><div style="padding:8px 12px;background:var(--gray-50);border-radius:6px;font-size:0.9286rem">姓名：<b>'+escapeHtmlAttr(s.name)+'</b>　班级：'+(s.className||'-')+'　当前宿舍：'+curRoom+'　当前床号：'+(s.bedNumber||'-')+'</div></div>'
            + '<div class="form-group"><label>目标宿舍号 *</label><select id="transferDormId" onchange="onTransferDormChange()">'+dormOpts+'</select></div>'
            + '<div class="form-group"><label>目标床号 *</label><select id="transferBed">'+bedOpts+'</select></div>'
            + '<div style="font-size:0.8571rem;color:#888">提示：已被占用的床位将显示占用者姓名且不可选择</div>'
            + '</div>'
            + '<div class="em-footer"><button class="btn btn-primary" onclick="saveTransfer()">💾 确认调宿</button><button class="btn btn-outline" onclick="closeTransferModal()">取消</button></div>';
        document.getElementById('transferModalBox').innerHTML = html;
        document.getElementById('transferModal').classList.add('show');
    }
    function closeTransferModal(){
        var m=document.getElementById('transferModal');
        if(m) m.classList.remove('show');
        transferStudentId = null;
    }
    // 生成目标宿舍的床位选项：已被占用的床位标注占用者并禁用
    function buildBedOptions(dormId, currentStudentId){
        var beds = ['1','2','3','4','5','6','7','8'];
        var occupants = {};
        getStudentsByDormitory(dormId).forEach(function(st){
            if(st.id !== currentStudentId && st.bedNumber) occupants[String(st.bedNumber)] = st.name;
        });
        return beds.map(function(b){
            if(occupants[b]){
                return '<option value="'+b+'" disabled>床位 '+b+'（已被 '+occupants[b]+' 占用）</option>';
            }
            return '<option value="'+b+'">床位 '+b+'</option>';
        }).join('');
    }
    function onTransferDormChange(){
        var dormId = parseInt(document.getElementById('transferDormId').value);
        var bedSelect = document.getElementById('transferBed');
        if(!bedSelect || !dormId) return;
        bedSelect.innerHTML = buildBedOptions(dormId, transferStudentId);
    }
    function saveTransfer(){
        if(!isAdmin()){toast('无权限操作','error');return;}
        if(transferStudentId === null){toast('参数错误','error');return;}
        var s = getStudentById(transferStudentId);
        if(!s){toast('学生不存在','error');closeTransferModal();return;}
        var targetDormId = parseInt(document.getElementById('transferDormId').value);
        var targetBed = document.getElementById('transferBed').value;
        var targetDorm = getDormitoryById(targetDormId);
        if(!targetDormId || !targetDorm){toast('请选择目标宿舍','error');return;}
        if(!targetBed){toast('请选择目标床号','error');return;}
        // 校验：目标宿舍不能与当前相同
        if(s.dormitoryId === targetDormId){
            // 同宿舍仅换床位，允许；但若床位未变则提示
            if(String(s.bedNumber) === String(targetBed)){
                toast('目标宿舍与床位与当前相同','error');return;
            }
        }
        // 校验：目标床位未被占用
        var occupied = getStudentsByDormitory(targetDormId).find(function(st){
            return st.id !== s.id && String(st.bedNumber) === String(targetBed);
        });
        if(occupied){toast('该床位已被 '+occupied.name+' 占用，请选择其他床位','error');return;}
        s.dormitoryId = targetDormId;
        s.bedNumber = targetBed;
        // V3 按行存储：学生调宿修改，标记脏记录
        v3MarkDirty('student', transferStudentId);
        saveDB();
        toast(s.name+' 已调至 '+targetDorm.roomNumber+' 床位 '+targetBed);
        closeTransferModal();
        renderView();
        renderTree();
    }

    // ==================== 记录修改（仅生活老师 STAFF 可用） ====================
    var editRecordId=null;
    function escapeHtmlAttr(s){
        return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
    // 打开修改模态框：回填日期/备注，并按记录勾选卫生与纪律项目（含自定义项目）
    function editRecord(id){
        if(!currentUser||currentUser.role!=='STAFF'){toast('无权限操作','error');return;}
        var r=null;
        for(var i=0;i<DB.deductionRecords.length;i++){if(String(DB.deductionRecords[i].id)===String(id)){r=DB.deductionRecords[i];break;}}
        if(!r){toast('记录不存在','error');return;}
        editRecordId=id;
        function buildChecks(items,recordIds,prefix,customLabel,customScoreText){
            var html=items.map(function(i){
                var checked=(recordIds||[]).indexOf(i.id)!==-1?' checked':'';
                return '<label><input type="checkbox" value="'+i.id+'" class="'+prefix+'-item"'+checked+' onchange="updateEditScores()"> '+i.name+' (-'+i.defaultScore+'分)</label>';
            }).join('');
            // 回填自定义项目：记录中以 'custom:名称' 存储，卫生0.2分/纪律1分
            var customName='';
            (recordIds||[]).forEach(function(v){ if(typeof v==='string'&&v.indexOf('custom:')===0) customName=v.substring(7); });
            html+='<label><input type="checkbox" value="custom" class="'+prefix+'-item"'+(customName?' checked':'')+' onchange="emCustomChange(\''+prefix+'\')"> ✏️ '+customLabel+'('+customScoreText+')</label>';
            html+='<span id="'+prefix+'CustomWrap" style="display:'+(customName?'inline-block':'none')+';margin-left:8px;"><input type="text" id="'+prefix+'CustomName" placeholder="自定义项目名称" value="'+escapeHtmlAttr(customName)+'" style="padding:4px 8px;border:1px dashed #ccc;border-radius:4px;"></span>';
            return html;
        }
        var hyChecks=buildChecks(DB.deductionItems.hygiene||[],r.hygieneItemIds,'em-hy','自定义','0.2分');
        var disChecks=buildChecks(DB.deductionItems.discipline||[],r.disciplineItemIds,'em-dis','自定义','1分');
        var html='<div class="em-header"><span>✏️ 修改扣分记录</span><button class="em-close" aria-label="关闭" onclick="closeEditModal()">✕</button></div>'
            +'<div class="em-body">'
            +'<div class="form-group"><label>扣分日期 *</label><input type="text" class="date-picker" id="emDate" value="'+escapeHtmlAttr(r.recordDate)+'"></div>'
            +'<div class="form-group"><label>备注</label><input type="text" id="emRemark" placeholder="可填写具体原因..." value="'+escapeHtmlAttr(r.remark)+'"></div>'
            +'<div class="form-group"><label>🧹 卫生加扣分（可多选）</label><div class="checkbox-group">'+hyChecks+'</div><div style="margin-top:5px">卫生扣分合计：<b id="emHyScore">0</b> 分</div></div>'
            +'<div class="form-group"><label>📏 纪律加扣分（可多选）</label><div class="checkbox-group">'+disChecks+'</div><div style="margin-top:5px">纪律扣分合计：<b id="emDisScore">0</b> 分</div></div>'
            +'</div>'
            +'<div class="em-footer"><button class="btn btn-primary" onclick="saveEditedRecord()">💾 保存修改</button><button class="btn btn-outline" onclick="closeEditModal()">取消</button></div>';
        document.getElementById('editModalBox').innerHTML=html;
        document.getElementById('editModal').classList.add('show');
        updateEditScores();
        initDatePickers(document); // 初始化修改日期选择器
    }
    // 自定义项目复选框联动：显示/隐藏名称输入框并重算合计
    function emCustomChange(prefix){
        var check=document.querySelector('.'+prefix+'-item[value="custom"]');
        var wrap=document.getElementById(prefix+'CustomWrap');
        var nameInput=document.getElementById(prefix+'CustomName');
        if(check&&wrap){
            wrap.style.display=check.checked?'inline-block':'none';
            if(!check.checked&&nameInput) nameInput.value='';
        }
        updateEditScores();
    }
    // 依据勾选项目实时重算合计（预设取 defaultScore，卫生自定义0.2/纪律自定义1）
    function updateEditScores(){
        function sum(prefix,customScore){
            var total=0;
            var checked=document.querySelectorAll('.'+prefix+'-item:checked');
            for(var i=0;i<checked.length;i++){
                if(checked[i].value==='custom') total+=customScore;
                else{var it=getItemById(parseInt(checked[i].value));if(it) total+=it.defaultScore;}
            }
            return total;
        }
        var hy=sum('em-hy',0.2), dis=sum('em-dis',1);
        var hyEl=document.getElementById('emHyScore'); if(hyEl) hyEl.textContent=hy;
        var disEl=document.getElementById('emDisScore'); if(disEl) disEl.textContent=dis;
        return {hy:hy,dis:dis};
    }
    // 保存修改：校验→重算分值→更新记录→持久化→刷新视图与树
    function saveEditedRecord(){
        if(editRecordId===null) return;
        if(!currentUser||currentUser.role!=='STAFF'){toast('无权限操作','error');return;}
        var r=null;
        for(var i=0;i<DB.deductionRecords.length;i++){if(String(DB.deductionRecords[i].id)===String(editRecordId)){r=DB.deductionRecords[i];break;}}
        if(!r){toast('记录不存在','error');closeEditModal();return;}
        var date=document.getElementById('emDate').value;
        if(!date){toast('请选择扣分日期','error');return;}
        function collectItems(prefix,customScore){
            var ids=[],score=0;
            var checked=document.querySelectorAll('.'+prefix+'-item:checked');
            for(var i=0;i<checked.length;i++){
                if(checked[i].value==='custom'){
                    var name=document.getElementById(prefix+'CustomName').value.trim();
                    if(!name){return null;}
                    ids.push('custom:'+name);
                    score+=customScore;
                }else{
                    var v=parseInt(checked[i].value);
                    ids.push(v);
                    var it=getItemById(v);
                    if(it) score+=it.defaultScore;
                }
            }
            return {ids:ids,score:score};
        }
        var hy=collectItems('em-hy',0.2);
        if(hy===null){toast('请输入自定义卫生项目名称','error');return;}
        var dis=collectItems('em-dis',1);
        if(dis===null){toast('请输入自定义纪律项目名称','error');return;}
        if(hy.ids.length===0&&dis.ids.length===0){toast('请至少勾选一个扣分项目','error');return;}
        r.recordDate=date;
        r.remark=document.getElementById('emRemark').value.trim();
        r.hygieneItemIds=hy.ids;
        r.hygieneScore=hy.score;
        r.disciplineItemIds=dis.ids;
        r.disciplineScore=dis.score;
        // 修改记录重传：登记脏记录并移出已同步集合，随 saveDB 的增量上传以本地版本覆盖云端
        var k=String(r.id);
        if(DB.dirtyRecordIds.indexOf(k)===-1) DB.dirtyRecordIds.push(k);
        var si=DB.syncedRecordIds.indexOf(k);
        if(si>-1) DB.syncedRecordIds.splice(si,1);
        r.lastModified=Date.now();
        // V3 按行存储：修改扣分记录 → 脏标记
        v3MarkDirty('deduction_record', r.id);
        saveDB();
        closeEditModal();
        toast('修改已保存');
        renderView();
        renderTree();
    }

    // 重渲染前同步表单输入到状态（日期/备注/分值/已勾选项/自定义名称）
    function syncAddFormInputs(){
        var d=document.getElementById('addDate'); if(d&&d.value) addFormState.recordDate=d.value;
        var r=document.getElementById('addRemark'); if(r) addFormState.remark=r.value;
        var hs=document.getElementById('hyScore'); if(hs) addFormState.hygieneScore=parseFloat(hs.value)||0;
        var dsc=document.getElementById('disScore'); if(dsc) addFormState.disciplineScore=parseFloat(dsc.value)||0;
        addFormState.hygieneItemIds=Array.prototype.map.call(document.querySelectorAll('.hy-item-checkbox:checked'),function(c){return c.value;});
        addFormState.disciplineItemIds=Array.prototype.map.call(document.querySelectorAll('.dis-item-checkbox:checked'),function(c){return c.value;});
        var hn=document.getElementById('hyCustomName'); if(hn) addFormState.hyCustomName=hn.value;
        var dn=document.getElementById('disCustomName'); if(dn) addFormState.disCustomName=dn.value;
    }
    // 依据状态重新勾选扣分项目（切层/切宿舍后恢复选择）
    function restoreAddChecks(){
        function restore(cls,arr){
            (arr||[]).forEach(function(v){
                var el=document.querySelector('.'+cls+'[value="'+v+'"]');
                if(el) el.checked=true;
            });
        }
        restore('hy-item-checkbox',addFormState.hygieneItemIds);
        restore('dis-item-checkbox',addFormState.disciplineItemIds);
    }
    // 依据当前勾选重算合计并同步自定义输入框显隐/回填
    function recomputeAddScores(){
        ['hy','dis'].forEach(function(t){
            var total=0,any=false;
            var checked=document.querySelectorAll('.'+t+'-item-checkbox:checked');
            for(var i=0;i<checked.length;i++){
                any=true;
                if(checked[i].value==='custom') total+=(t==='hy'?0.2:1);
                else{var it=getItemById(parseInt(checked[i].value));if(it) total+=it.defaultScore;}
            }
            var input=document.getElementById(t==='hy'?'hyScore':'disScore');
            if(input) input.value=any?total:0;
            if(t==='hy') addFormState.hygieneScore=any?total:0; else addFormState.disciplineScore=any?total:0;
            var cc=document.querySelector('.'+t+'-custom-check');
            var wrap=document.getElementById(t+'CustomInputWrap');
            if(cc&&wrap) wrap.style.display=cc.checked?'inline-block':'none';
            var nameInput=document.getElementById(t+'CustomName');
            if(nameInput){
                if(cc.checked) nameInput.value=(t==='hy'?addFormState.hyCustomName:addFormState.disCustomName)||'';
                else{ nameInput.value=''; if(t==='hy') addFormState.hyCustomName=''; else addFormState.disCustomName=''; }
            }
        });
    }

        var disSectionExists=document.getElementById('disScore')!==null;
        if(hySectionExists){
            var hyChecked=document.querySelectorAll('.hy-item-checkbox:checked');
            for(var i=0;i<hyChecked.length;i++){
                if(hyChecked[i].value==='custom'){
                    var customName=document.getElementById('hyCustomName').value.trim();
                    if(!customName){toast('请输入自定义卫生项目名称','error');return;}
                    hygieneItemIds.push('custom:'+customName);
                } else hygieneItemIds.push(parseInt(hyChecked[i].value));
            }
            hygieneScore=parseFloat(document.getElementById('hyScore').value)||0;
        }
        if(disSectionExists){
            var disChecked=document.querySelectorAll('.dis-item-checkbox:checked');
            for(var i=0;i<disChecked.length;i++){
                if(disChecked[i].value==='custom'){
                    var customName=document.getElementById('disCustomName').value.trim();
                    if(!customName){toast('请输入自定义纪律项目名称','error');return;}
                    disciplineItemIds.push('custom:'+customName);
                } else disciplineItemIds.push(parseInt(disChecked[i].value));
            }
            disciplineScore=parseFloat(document.getElementById('disScore').value)||0;
        }
        if(hygieneItemIds.length===0 && disciplineItemIds.length===0){toast('请至少选择一个扣分项目','error');return;}
        var newRecord={id:generateRecordId(),createdAt:Date.now(),dormitoryId:addFormState.dormitoryId,studentId:addFormState.studentId||null,hygieneItemIds:hygieneItemIds,hygieneScore:hygieneScore,disciplineItemIds:disciplineItemIds,disciplineScore:disciplineScore,recordDate:addFormState.recordDate,remark:addFormState.remark||''};
        DB.deductionRecords.push(newRecord);
        // V3 按行存储：标记为脏，新增记录首次上传
        v3MarkDirty('deduction_record', newRecord.id);
        saveDB();
        toast('登记成功！');
        addFormState.studentId=null; addFormState.hygieneItemIds=[]; addFormState.disciplineItemIds=[]; addFormState.remark='';
        renderAddView(document.getElementById('contentArea'));
        renderTree();

    // ==================== 统计报表视图 ====================
    function renderStatsView(container){
        var allRecords = DB.deductionRecords;
        var total = getTotalScore(allRecords);
        // 楼层排名：扣分从高到低，同分按楼层原顺序（稳定排序）
        var floorStats = DB.floors.map(function(f){ var r=getRecordsByFloor(f.id); return {id:f.id,name:f.name,score:getTotalScore(r),count:r.length}; }).sort(function(a,b){return b.score-a.score;});
        // 全校宿舍排行：扣分从高到低，同分按宿舍号升序（含 0 分宿舍，排名连续）；已删除的宿舍号不参与排行
        var dormStatsAll = [];

            if(isDormitoryDeleted(d.roomNumber)) return;
            var r = getRecordsByDormitory(d.id);

            dormStatsAll.push({ roomNumber: d.roomNumber, name: d.roomNumber + ' (' + getFloorById(d.floorId).name + ')', className: getDormitoryClassName(d.id), score: score, count: r.length });
        });
        dormStatsAll.sort(function(a,b){ if(a.score!==b.score) return b.score-a.score; return a.roomNumber.localeCompare(b.roomNumber,'zh-Hans-CN',{numeric:true}); });
        statsCache.dormAll = dormStatsAll;
        // 楼层条形图（两端共用）
        var floorBarsHtml = floorStats.map(function(f,i){ var max=floorStats[0].score||1; var pct=max>0?(f.score/max*100):0; var colors=['#4f6ef7','#7c5cfc','#a855f7','#ec4899','#f43f5e','#f97316','#eab308','#22c55e']; return '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><span style="font-weight:700;width:30px">#'+(i+1)+'</span><span style="width:50px">'+f.name+'</span><div style="flex:1;height:22px;background:#f0f0f0;border-radius:11px;overflow:hidden;"><div style="height:100%;width:'+pct+'%;background:'+colors[i%colors.length]+';border-radius:11px;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;"><span style="color:#fff;font-size:0.7857rem;font-weight:700">'+f.score+'分</span></div></div><span style="min-width:40px;font-size:0.8571rem;color:#6b7280;">'+f.count+'条</span></div>'; }).join('');
        // 全校宿舍排行榜：默认 TOP20，可展开全部（含 0 分）
        function dormRowsHtml(list){
            if(!list.length) return '<tr><td colspan="5" style="text-align:center;color:#aaa">暂无数据</td></tr>';
            return list.map(function(d,i){ return '<tr><td data-label="排名">'+(i+1)+'</td><td data-label="宿舍"><b>'+d.name+'</b></td><td data-label="班级">'+(d.className||'-')+'</td><td data-label="扣分" class="highlight-red">'+d.score+'</td><td data-label="记录数">'+d.count+'</td></tr>'; }).join('');
        }
        function dormSectionHtml(){
            var list = statsDormExpandAll ? dormStatsAll : dormStatsAll.slice(0,20);
            var btn = dormStatsAll.length>20
                ? '<div style="text-align:center;padding:10px 14px 14px"><button class="btn btn-primary btn-sm" onclick="toggleStatsDormAll()">'+(statsDormExpandAll?'收起':'展开查看全部（共'+dormStatsAll.length+'个宿舍）')+'</button></div>'
                : '';
            var isMobileS = window.innerWidth<=768;
            if(isMobileS){
                // 移动端：卡片式布局，复用楼层扣分情况已验证的 dorm-row-mobile / rank-item 样式
                var mobileCards = list.map(function(item, idx){

                        + '<div class="rank-item rank-idx-3"><span class="rank-label">班级</span><span class="rank-value">'+(item.className||'—')+'</span></div>'

                        + '<div class="rank-item rank-idx-5"><span class="rank-label">记录数</span><span class="rank-value">'+item.count+'条</span></div>'

                return '<div style="padding:2px 0">'+mobileCards+'</div>'+btn;
            }
            return '<div style="overflow-x:auto"><table><thead><tr><th>排名</th><th>宿舍</th><th>班级</th><th>扣分</th><th>记录数</th></tr></thead><tbody>'+dormRowsHtml(list)+'</tbody></table></div>'+btn;
        }
        statsCache.dormSectionHtml = dormSectionHtml;
        // 楼层扣分情况：单楼层全部宿舍（含 0 分），扣分从低到高、同分按宿舍号升序；芯片切换楼层
        if(!statsFloorPickId || !getFloorById(statsFloorPickId)) statsFloorPickId = DB.floors[0] ? DB.floors[0].id : null;
        function floorDetailHtml(){
            var roomsInFloor = getDormitoriesByFloor(statsFloorPickId);

                var r = getRecordsByDormitory(d.id);

            });
            // 扣分从低到高排序（扣分少在前），同分按宿舍号升序
            dormList.sort(function(a,b){ if(a.score !== b.score) return a.score - b.score; return a.roomNumber.localeCompare(b.roomNumber,'zh-Hans-CN',{numeric:true}); });
            var rowsHtml = dormList.map(function(item, idx){
                var rank = idx+1;
                var topCls = rank<=3 ? ' top' : '';
                var scoreHas = item.score>0 ? ' has' : '';

                    + '<div class="rank-item rank-idx-2"><span class="rank-label">宿舍</span><span class="rank-value">'+item.roomNumber+'</span></div>'
                    + '<div class="rank-item rank-idx-3"><span class="rank-label">班级</span><span class="rank-value">'+(item.className||'—')+'</span></div>'
                    + '<div class="rank-item rank-idx-4"><span class="rank-label">扣分</span><span class="rank-value'+scoreHas+'">'+item.score+'分</span></div>'

            var floorChips = DB.floors.map(function(f2){
                return '<div class="chip'+(f2.id===statsFloorPickId?' active':'')+'" onclick="selectStatsFloor('+f2.id+')">'+f2.name+'</div>';
            }).join('');
            return '<div style="padding:8px 2px 4px"><div class="chip-floors-scroll">'+floorChips+'</div></div>'
                + '<div style="padding:10px 0 4px">'+rowsHtml+'</div>';

        statsCache.floorDetailHtml = floorDetailHtml;
        // 各楼层独立详情卡（PC 端保留原有样式）
        var floorDormLowTables = '';
        DB.floors.forEach(function(f){
            var roomsInFloor = getDormitoriesByFloor(f.id);
            var dormList = roomsInFloor.map(function(d){
                var r = getRecordsByDormitory(d.id);
                var score = getTotalScore(r);
                return { roomNumber: d.roomNumber, className: getDormitoryClassName(d.id), score: score, count: r.length };
            });
            dormList.sort(function(a,b){ if(a.score !== b.score) return a.score - b.score; return a.roomNumber.localeCompare(b.roomNumber,'zh-Hans-CN',{numeric:true}); });
            var rowsHtml = dormList.map(function(item, idx){ return '<tr><td data-label="排名">'+(idx+1)+'</td><td data-label="宿舍">'+item.roomNumber+'</td><td data-label="班级">'+item.className+'</td><td data-label="扣分">'+item.score+'</td><td data-label="记录数">'+item.count+'</td></tr>'; }).join('');
            floorDormLowTables += '<div class="card" style="margin-bottom:16px;"><div class="card-header">📉 '+f.name+' · 扣分少的宿舍排名</div><div style="overflow-x:auto;"><table><thead><tr><th>排名</th><th>宿舍</th><th>班级</th><th>扣分</th><th>记录数</th></tr></thead><tbody>'+(rowsHtml||'<tr><td colspan="5" style="text-align:center;color:#aaa">暂无数据</td></tr>')+'</tbody></table></div></div>';
        });
        // 折叠块骨架（开合状态跨重渲染保持）；局部刷新区（排行榜/楼层详情）仅替换 wrap 内部，不影响折叠状态
        function foldBlock(id, title, bodyHtml){
            return '<div class="fold-block'+(foldState[id]?' open':'')+'" id="'+id+'"><div class="fold-header" onclick="toggleFold(\''+id+'\')">'+title+'<span class="fold-arrow">▶</span></div><div class="fold-body">'+bodyHtml+'</div></div>';
        }
        var topTitle = '🏠 全校宿舍排行榜' + (statsDormExpandAll ? '<span class="fold-sub">全部'+dormStatsAll.length+'个</span>' : '<span class="fold-sub">TOP20</span>');
        var topBody = '<div id="statsDormWrap">'+dormSectionHtml()+'</div>';
        var mobileDetailBody = '<div id="statsFloorDetailWrap">'+floorDetailHtml()+'</div>';
        var pcDetailBody = '<div style="padding:14px">'+floorDormLowTables+'</div>';
        container.innerHTML = '<div class="content-header"><h2>📊 统计报表</h2></div>'

            + (window.innerWidth<=768
                ? foldBlock('fold-stats-detail','📉 楼层扣分情况', mobileDetailBody)
                : foldBlock('fold-stats-detail','📉 各楼层扣分详情', pcDetailBody));
    }
    // 统计报表交互状态：排行榜展开全部 / 楼层扣分情况当前楼层（跨重渲染保持）
    var statsDormExpandAll=false;

        activeDorms.sort(function(a,b){ return String(a.roomNumber).localeCompare(String(b.roomNumber),'zh-Hans-CN',{numeric:true}); });

        studentSearch.className = className;

    function toggleAllStudents(checked){ var checkboxes=document.querySelectorAll('.student-checkbox'); for(var i=0;i<checkboxes.length;i++) checkboxes[i].checked=checked; updateSelectedCount(); }
    function updateSelectedCount(){ var checked=document.querySelectorAll('.student-checkbox:checked'); var selectAll=document.getElementById('selectAllStudents'); if(selectAll){var total=document.querySelectorAll('.student-checkbox').length; selectAll.checked=total>0&&checked.length===total;} }
    function deleteSelectedStudents(){
        if(!isAdmin()){toast('无权限','error');return;}
        var checkedBoxes=document.querySelectorAll('.student-checkbox:checked');
        if(checkedBoxes.length===0){toast('请先选择要删除的学生','error');return;}
        if(!confirm('确认删除选中的 '+checkedBoxes.length+' 名学生？此操作不可撤销！')) return;

    // 确保宿舍号存在（导入学生名单时自动补建）：返回 {dorm, autoAdded}，无效返回 null
    function ensureDormitoryRoom(roomNumber){
        roomNumber = String(roomNumber).trim();
        if(!/^[1-8][0-9]{2}$/.test(roomNumber)) return null;
        var existing = getDormitoryByRoomNumber(roomNumber);
        if(existing){
            // 已在 dormitories 中：若不在 dormitoryList（曾被删除），重新激活
            if(DB.dormitoryList.indexOf(roomNumber) === -1){
                DB.dormitoryList.push(roomNumber);
                // V3 按行存储：dormitoryList 变化 → meta 脏
                v3MarkDirty('meta', 'main');
                return { dorm:existing, autoAdded:true };
            }
            return { dorm:existing, autoAdded:false };
        }
        // 全新宿舍号：创建 dormitories 条目并加入 dormitoryList
        var floorNum = parseInt(roomNumber.charAt(0));
        var floor = DB.floors.find(function(f){ return f.sortOrder === floorNum; });
        if(!floor) return null;
        var newDorm = { id:DB.nextIds.dormitory++, floorId:floor.id, roomNumber:roomNumber, capacity:8 };
        DB.dormitories.push(newDorm);
        DB.dormitoryList.push(roomNumber);
        // V3 按行存储：新宿舍 + dormitoryList 变化 → 脏标记
        v3MarkDirty('dormitory', newDorm.id);
        v3MarkDirty('meta', 'main');
        return { dorm:newDorm, autoAdded:true };
    }
    function batchImportStudents(){
        if(!isAdmin()){toast('无权限','error');return;}
        var text=document.getElementById('batchImportText').value.trim();
        if(!text){toast('请粘贴学生数据','error');return;}
        var lines=text.split('\n');
        var imported=0;
        var autoAdded=0;
        var nonResident=0;
        for(var i=0;i<lines.length;i++){
            var line=lines[i].trim();
            if(!line) continue;
            var parts=line.split(/[,，\t]/);
            if(parts.length<3) continue;
            var name=parts[0].trim();
            var className=parts[1].trim();
            var roomNumber=parts[2].trim();
            var bedNumber=parts.length>3?parts[3].trim():'';
            // 非住宿生：宿舍号为 0 或空时，dormitoryId=null，标记为走读生
            if(roomNumber===''||roomNumber==='0'||roomNumber.toLowerCase()==='null'){
                var nonStuId = DB.nextIds.student++;
                DB.students.push({id:nonStuId,dormitoryId:null,name:name,className:className,bedNumber:''});
                v3MarkDirty('student', nonStuId);
                imported++; nonResident++;
                continue;
            }
            var res=ensureDormitoryRoom(roomNumber);
            if(!res){toast('宿舍号无效或不存在：'+roomNumber,'error');continue;}
            if(res.autoAdded) autoAdded++;
            var impStuId = DB.nextIds.student++;
            DB.students.push({id:impStuId,dormitoryId:res.dorm.id,name:name,className:className,bedNumber:bedNumber});
            v3MarkDirty('student', impStuId);
            imported++;
        }
        saveDB();
        toast('成功导入'+imported+'名学生'+(autoAdded>0?'（自动新增'+autoAdded+'个宿舍号）':'')+(nonResident>0?'（含'+nonResident+'名走读生）':''));
        renderStudentsView(document.getElementById('contentArea'));
    }
    function handleExcelImport(file){
        if(!file) return;
        if(!isAdmin()){toast('无权限','error');return;}
        var reader=new FileReader();
        reader.onload=function(e){
            try{
                var data=new Uint8Array(e.target.result);
                var workbook=XLSX.read(data,{type:'array'});
                var firstSheet=workbook.Sheets[workbook.SheetNames[0]];
                var rows=XLSX.utils.sheet_to_json(firstSheet,{header:1});
                var validRows=rows.filter(function(row){return row.length>=2&&row[0]&&row[1];});
                var imported=0;
                var autoAdded=0;
                var nonResident=0;
                validRows.forEach(function(row){
                    var name=String(row[0]).trim();
                    var className=String(row[1]).trim();
                    var roomNumber=row.length>2?String(row[2]).trim():'';
                    var bedNumber=row.length>3?String(row[3]).trim():'';
                    // 非住宿生：宿舍号为 0 或空时，dormitoryId=null
                    if(roomNumber===''||roomNumber==='0'||roomNumber.toLowerCase()==='null'){
                        var exNonStu = DB.nextIds.student++;
                        DB.students.push({id:exNonStu,dormitoryId:null,name:name,className:className,bedNumber:''});
                        v3MarkDirty('student', exNonStu);
                        imported++; nonResident++;
                        return;
                    }
                    var res=ensureDormitoryRoom(roomNumber);
                    if(!res){toast('宿舍号无效或不存在：'+roomNumber,'error');return;}
                    if(res.autoAdded) autoAdded++;
                    var exStuId = DB.nextIds.student++;
                    DB.students.push({id:exStuId,dormitoryId:res.dorm.id,name:name,className:className,bedNumber:bedNumber});
                    v3MarkDirty('student', exStuId);
                    imported++;
                });
                saveDB();
                toast('成功从Excel导入'+imported+'名学生'+(autoAdded>0?'（自动新增'+autoAdded+'个宿舍号）':'')+(nonResident>0?'（含'+nonResident+'名走读生）':''));
                renderStudentsView(document.getElementById('contentArea'));
            }catch(err){
                console.error('Excel解析失败:',err);
                toast('Excel解析失败，请检查文件格式','error');
            }
        };
        reader.readAsArrayBuffer(file);
    }

    // ==================== 宿舍号管理（仅管理员） ====================
    // 按楼层分组返回生效宿舍号及其入住人数
    function getDormitoryListByFloor(){
        ensureSyncMeta();
        var result = [];
        DB.floors.forEach(function(f){
            var dorms = getDormitoriesByFloor(f.id);
            if(dorms.length === 0) return;
            dorms.sort(function(a,b){ return String(a.roomNumber).localeCompare(String(b.roomNumber),'zh-Hans-CN',{numeric:true}); });
            var items = dorms.map(function(d){
                var count = getStudentsByDormitory(d.id).length;
                return { id:d.id, roomNumber:d.roomNumber, count:count };
            });
            result.push({ floorId:f.id, floorName:f.name, items:items });
        });
        return result;
    }

    function addDormitory(){
        if(!isAdmin()){toast('无权限','error');return;}
        var input = document.getElementById('newDormRoom');
        var val = input ? input.value.trim() : '';
        if(!val){toast('请输入宿舍号','error');return;}
        // 校验：三位数字，百位1-8
        if(!/^[1-8][0-9]{2}$/.test(val)){
            toast('宿舍号必须为三位数字，且首位为1-8','error');
            return;
        }
        // 不允许重复
        if(DB.dormitoryList.indexOf(val) !== -1){
            toast('宿舍号 '+val+' 已存在','error');
            return;
        }
        var floorNum = parseInt(val.charAt(0));
        var floor = DB.floors.find(function(f){ return f.sortOrder === floorNum; });
        if(!floor){ toast('无法识别楼层','error'); return; }
        // 在 dormitories 中查找是否已存在该房间（历史软删除场景）
        var existingDorm = getDormitoryByRoomNumber(val);
        if(existingDorm){
            // 已存在于 dormitories 但不在 dormitoryList（曾被删除），重新激活
            if(DB.dormitoryList.indexOf(val) === -1) DB.dormitoryList.push(val);
            // V3 按行存储：重新激活 + meta 脏
            v3MarkDirty('meta', 'main');
        } else {
            // 全新宿舍号
            var newId = DB.nextIds.dormitory++;
            DB.dormitories.push({ id:newId, floorId:floor.id, roomNumber:val, capacity:8 });
            DB.dormitoryList.push(val);
            // V3 按行存储：新宿舍 + meta 脏
            v3MarkDirty('dormitory', newId);
            v3MarkDirty('meta', 'main');
        }
        saveDB();
        toast('宿舍号 '+val+' 已添加');
        input.value = '';
        renderDormitoryManage();
        renderTree();
    }
    function deleteDormitory(roomNumber){
        if(!isAdmin()){toast('无权限','error');return;}
        roomNumber = String(roomNumber);
        var dorm = getDormitoryByRoomNumber(roomNumber);
        if(!dorm){ toast('宿舍号不存在','error'); return; }
        var residents = getStudentsByDormitory(dorm.id);
        if(residents.length > 0){
            var names = residents.map(function(s){ return s.name+'('+(s.className||'')+')'; }).join('、');
            alert('该宿舍尚有 '+residents.length+' 名学生入住，请先迁出或调宿后再删除。\n入住学生：'+names);
            return;
        }
        if(!confirm('确定删除宿舍 ['+roomNumber+'] 吗？\n（历史扣分/退宿记录将保留，但该宿舍号不再出现在选择列表中）')) return;
        // 仅从 dormitoryList 移除（控制可见性），保留 dormitories 条目以供历史记录引用
        DB.dormitoryList = DB.dormitoryList.filter(function(r){ return r !== roomNumber; });
        // V3 按行存储：dormitoryList 变化 → meta 脏
        v3MarkDirty('meta', 'main');
        saveDB();
        toast('宿舍号 '+roomNumber+' 已删除');
        // 若当前选中的是被删宿舍，清空选择
        if(selectedDormitoryId === dorm.id){ selectedDormitoryId = null; selectedFloorId = null; }
        renderDormitoryManage();
        renderTree();
        renderView();
    }

        if(!confirm('确定要删除全部退宿记录吗？此操作不可恢复！')) return;
        // V3 按行存储：先标记所有待删退宿记录
        (DB.leaveRecords||[]).forEach(function(r){ if(r && r.type==='leave' && r.id!=null) v3MarkDeleted('leave_record', r.id); });
        DB.leaveRecords=(DB.leaveRecords||[]).filter(function(r){return r.type!=='leave';});
        saveDB();
        toast('已删除全部退宿记录');
        renderView();
    }

    // 色块互斥展开/收起：点击已展开的收起；点击其他色块时前一个自动收起
    // 展开/收起完全由 .open 类 + CSS max-height 过渡完成（无 JS 高度测量，不会卡住在半开状态）
    function toggleAccBlock(type){
        ['leave','stop','absence'].forEach(function(t){
            var block=document.getElementById('accBlock-'+t);
            var arrow=document.getElementById('accArrow-'+t);
            if(!block) return;
            if(t===type){
                var opening=!block.classList.contains('open');
                block.classList.toggle('open',opening);
                if(arrow) arrow.textContent=opening?'▼':'▶';

            }
        });

    var PC_DL = {

    function __pcFillDl(id, values){

    function updatePcDatalists(p){
        var m=PC_DL[p];
        if(!m) return;
        var clsEl=document.getElementById(m.classInput);
        if(!clsEl) return;
        var clsVal=clsEl.value.trim();
        var nameEl=document.getElementById(m.nameInput);
        var dormEl=document.getElementById(m.dormInput);
        var nameVal=nameEl?nameEl.value.trim():'';
        var dormVal=dormEl?dormEl.value.trim():'';
        // 班级建议列表（班级 datalist 已移除：班级账号为只读，管理员/生活老师为 select 下拉）
        // 姓名：按班级过滤（班级已选时显示该班全部学生，不因选中宿舍/姓名而收窄）；
        // 班级未选时，若选了宿舍则显示该宿舍学生，否则全部学生
        var pool=DB.students;
        if(clsVal){
            pool=pool.filter(function(s){ return s.className===clsVal; });
        } else if(dormVal){
            var d=DB.dormitories.find(function(x){ return x.roomNumber===dormVal; });
            pool=d?getStudentsByDormitory(d.id):[];
        }
        var nameSet={}; pool.forEach(function(s){ if(s.name) nameSet[s.name]=true; });
        __pcFillDl(m.name, Object.keys(nameSet));
        // 宿舍号：班级→该班学生入住宿舍去重；否则全部宿舍（仅生效宿舍号）。不按姓名过滤，保持完整。
        var dormSet={};
        if(clsVal){
            DB.students.forEach(function(s){
                if(s.className!==clsVal) return;
                var d=getDormitoryById(s.dormitoryId);
                if(d && !isDormitoryDeleted(d.roomNumber)) dormSet[d.roomNumber]=true;
            });
        } else {
            DB.dormitories.forEach(function(d){ if(!isDormitoryDeleted(d.roomNumber)) dormSet[d.roomNumber]=true; });
        }
        __pcFillDl(m.dorm, Object.keys(dormSet).sort());
        // 床号：宿舍→该宿舍（限班级）床号；无宿舍→1-8。不按姓名过滤，保持完整。
        var beds=[];
        if(dormVal){
            var d2=DB.dormitories.find(function(x){ return x.roomNumber===dormVal; });
            if(d2){
                var bs={};
                getStudentsByDormitory(d2.id).forEach(function(s){
                    if((!clsVal||s.className===clsVal)&&s.bedNumber) bs[s.bedNumber]=true;
                });
                beds=Object.keys(bs).sort(function(a,b){ return parseInt(a)-parseInt(b); });
            }
        }
        if(!beds.length) beds=['1','2','3','4','5','6','7','8'];
        __pcFillDl(m.bed, beds);
    }

        if (nameInputEl) nameFilter = nameInputEl.value.trim().toLowerCase();

        if (currentUser && currentUser.role === 'CLASS_ADMIN') {
            className = currentUser.className;
        }
        var records=DB.leaveRecords||[];
        var filtered=records.filter(function(r){
            if(className && r.className!==className) return false;
            if(nameFilter && r.name.toLowerCase().indexOf(nameFilter)===-1) return false;
            return true;
        });
        var leaveRecords=filtered.filter(function(r){return r.type==='leave';});
        var stopRecords=filtered.filter(function(r){return r.type==='stop';});
        var isAdm=isAdmin();

        function adminOps(r){

    // 获取今日日期字符串（YYYY-MM-DD）
    function getTodayStr(){ return new Date().toISOString().split('T')[0]; }
    // 计算学生在住宿信息中的状态标签（按优先级从高到低）
    // 返回 {label, cls}；cls 对应 CSS 类 status-red/orange/purple/blue/green
    function getStudentStatus(studentId){
        if(!studentId) return {label:'在住', cls:'status-green'};
        var today=getTodayStr();
        var leaves=DB.leaveRecords||[];
        var absences=DB.absenceRecords||[];
        // 1. 已退宿（approved）
        if(leaves.some(function(r){return r.studentId===studentId&&r.type==='leave'&&r.status==='approved';}))
            return {label:'已退宿', cls:'status-red'};
        // 2. 退宿申请中（pending）
        if(leaves.some(function(r){return r.studentId===studentId&&r.type==='leave'&&r.status==='pending';}))
            return {label:'退宿申请中', cls:'status-orange'};
        // 3. 停宿中（approved 且未过期）
        if(leaves.some(function(r){return r.studentId===studentId&&r.type==='stop'&&r.status==='approved'&&r.endDate&&r.endDate>=today;}))
            return {label:'停宿中', cls:'status-purple'};
        // 4. 停宿申请中（pending）
        if(leaves.some(function(r){return r.studentId===studentId&&r.type==='stop'&&r.status==='pending';}))
            return {label:'停宿申请中', cls:'status-orange'};
        // 5. 请假中（未过期）
        if(absences.some(function(r){return r.studentId===studentId&&r.endDate&&r.endDate>=today;}))
            return {label:'请假中', cls:'status-blue'};
        // 6. 默认在住
        return {label:'在住', cls:'status-green'};
    }
    // 退宿/停宿记录在列表中的状态标签（含"已结束"判定）
    function getLeaveRecordStatusBadge(r){
        var today=getTodayStr();
        if(r.status==='pending') return '<span class="status-tag status-orange">待审核</span>';
        if(r.status==='rejected') return '<span class="status-tag status-red">已驳回</span>';
        // approved
        if(r.type==='stop'&&r.endDate&&r.endDate<today) return '<span class="status-tag status-gray">已结束</span>';
        return '<span class="status-tag status-green">已通过</span>';
    }
    // 请假记录在列表中的状态标签
    function getAbsenceStatusBadge(r){
        var today=getTodayStr();
        if(r.endDate&&r.endDate<today) return '<span class="status-tag status-gray">已结束</span>';
        return '<span class="status-tag status-blue">请假中</span>';
    }

    // 与关联 DB.students 过滤等价；日期方面退宿为单日、停宿为"起 至 止"区间（有交集即命中）
    function getFilteredLeaveRecords(f){
        // 数据管理页仅展示「已通过」的退宿/停宿记录（待审核/驳回属于流程态，不纳入统计与导出）
        var records=(DB.leaveRecords||[]).filter(function(r){return r.type===f.dataType&&(!r.status||r.status==='approved');});
        records=records.filter(function(r){
            var dStart=r.date, dEnd=r.date;
            if(f.dataType==='stop'){
                var parts=String(r.date).split('至');
                if(parts.length>=2){ dStart=parts[0].trim(); dEnd=parts[1].trim(); }
            }
            if(dEnd<f.startDate||dStart>f.endDate) return false;
            if(f.className&&r.className!==f.className) return false;
            if(f.dormRoom&&r.dormitory!==f.dormRoom) return false;
            if(f.bed&&String(r.bed)!==String(f.bed)) return false;
            if(f.studentName&&r.name!==f.studentName) return false;
            return true;
        });
        records.sort(function(a,b){ return a.date<b.date?-1:(a.date>b.date?1:0); });
        return records;
    }

    // 请假记录筛选：班级/姓名 + 日期范围与请假区间 [startDate,endDate] 取交集
    function getFilteredAbsenceRecords(f){
        var records=(DB.absenceRecords||[]).filter(function(r){
            var dStart=r.startDate||'', dEnd=r.endDate||dStart;
            if(dStart&&dEnd&&(dEnd<f.startDate||dStart>f.endDate)) return false;
            if(f.className&&r.className!==f.className) return false;
            // 请假记录使用专用姓名筛选字段（absenceName）
            var nameFilter=f.absenceName||f.studentName;
            if(nameFilter&&r.name!==nameFilter) return false;
            return true;
        });
        records.sort(function(a,b){ return (a.startDate||'')<(b.startDate||'')?-1:1; });
        return records;
    }

    // 统一填充数据管理页所有 datalist（班级/学生/宿舍号/床号）
    // 核心原则：选中值后选项列表保持完整，仅班级切换时重新加载班级数据
    function updateExportDatalists() {
        var className = document.getElementById('exportClass') ? document.getElementById('exportClass').value.trim() : '';
        if (currentUser && currentUser.role === 'CLASS_ADMIN') className = currentUser.className;
        var dormRoom = document.getElementById('exportDorm') ? document.getElementById('exportDorm').value.trim() : '';

        // 班级 datalist：全部班级
        var classSet={}; DB.students.forEach(function(s){ if(s.className) classSet[s.className]=true; });
        var classList=sortClassNames(Object.keys(classSet));
        var dlClass=document.getElementById('dlExportClass');
        if(dlClass) dlClass.innerHTML=classList.map(function(c){return '<option value="'+c+'"></option>';}).join('');

        // 宿舍号 datalist：班级→该班学生入住宿舍；否则全部生效宿舍
        var dormSet={};
        if(className){
            DB.students.forEach(function(s){
                if(s.className!==className) return;
                var d=getDormitoryById(s.dormitoryId);
                if(d && !isDormitoryDeleted(d.roomNumber)) dormSet[d.roomNumber]=true;
            });
        } else {
            DB.dormitories.forEach(function(d){ if(!isDormitoryDeleted(d.roomNumber)) dormSet[d.roomNumber]=true; });
        }
        var dlDorm=document.getElementById('dlExportDorm');
        if(dlDorm) dlDorm.innerHTML=Object.keys(dormSet).sort().map(function(r){return '<option value="'+r+'"></option>';}).join('');

        // 床号 datalist：宿舍→该宿舍床号；否则1-8
        var beds=[];
        if(dormRoom){
            var dormObj=DB.dormitories.find(function(d){return d.roomNumber===dormRoom;});
            if(dormObj){
                var bs={};
                getStudentsByDormitory(dormObj.id).forEach(function(s){
                    if((!className||s.className===className)&&s.bedNumber) bs[s.bedNumber]=true;
                });
                beds=Object.keys(bs).sort(function(a,b){return parseInt(a)-parseInt(b);});
            }
        }
        if(!beds.length) beds=['1','2','3','4','5','6','7','8'];
        var dlBed=document.getElementById('dlExportBed');
        if(dlBed) dlBed.innerHTML=beds.map(function(b){return '<option value="'+b+'"></option>';}).join('');

        // 学生 datalist：班级→该班学生；宿舍→该宿舍学生；否则全部
        var pool=DB.students;
        if(className) pool=pool.filter(function(s){return s.className===className;});
        else if(dormRoom){
            var d=DB.dormitories.find(function(x){return x.roomNumber===dormRoom;});
            pool=d?getStudentsByDormitory(d.id):[];
        }
        var nameSet={}; pool.forEach(function(s){if(s.name) nameSet[s.name]=true;});
        var dlStudent=document.getElementById('dlExportStudent');
        if(dlStudent) dlStudent.innerHTML=Object.keys(nameSet).map(function(n){return '<option value="'+n+'"></option>';}).join('');

        // 同步请假姓名 datalist
        updateExportAbsenceNameList();
    }

    // 查询筛选数据函数
    function queryFilteredData() {
        if(!isAdmin() && currentUser.role !== 'CLASS_ADMIN'){toast('无权限','error');return;}
        var f=getExportFilterValues();
        if(!f.startDate || !f.endDate){toast('请选择日期范围','error');return;}
        if(f.startDate > f.endDate){toast('开始日期不能晚于结束日期','error');return;}

        var resultArea = document.getElementById('queryResultArea');
        if (!resultArea) return;

        // ===== 退宿/停宿记录 =====
        if(f.dataType==='leave' || f.dataType==='stop'){
            var typeLabel=f.dataType==='leave'?'退宿':'停宿';
            var dateLabel=f.dataType==='leave'?'退宿时间':'停宿时间段';
            var leaveRecords=getFilteredLeaveRecords(f);
            if(leaveRecords.length===0){
                resultArea.innerHTML='<div class="card"><div class="card-header">查询结果</div><div class="card-body"><div class="empty-state">暂无符合条件的'+typeLabel+'记录</div></div></div>';
                return;
            }
            var leaveRows=leaveRecords.map(function(r){
                return '<tr><td data-label="'+dateLabel+'">'+r.date+'</td>'
                    + '<td data-label="宿舍号">'+getDormSnapshotDisplay(r.dormitory)+'</td>'
                    + '<td data-label="床号">'+r.bed+'</td>'
                    + '<td data-label="班级">'+r.className+'</td>'
                    + '<td data-label="姓名">'+r.name+'</td>'
                    + '<td data-label="原因">'+r.reason+'</td></tr>';
            }).join('');
            resultArea.innerHTML='<div class="card">'
                + '<div class="card-header">查询结果（'+typeLabel+'记录 '+leaveRecords.length+' 条）</div>'
                + '<div style="overflow-x:auto;"><table>'
                + '<thead><tr><th>'+dateLabel+'</th><th>宿舍号</th><th>床号</th><th>班级</th><th>姓名</th><th>原因</th></tr></thead>'
                + '<tbody>'+leaveRows+'</tbody>'
                + '</table></div></div>';
            return;
        }

        // ===== 请假记录 =====
        if(f.dataType==='absence'){
            var absRecords=getFilteredAbsenceRecords(f);
            if(absRecords.length===0){
                resultArea.innerHTML='<div class="card"><div class="card-header">查询结果</div><div class="card-body"><div class="empty-state">暂无符合条件的请假记录</div></div></div>';
                return;
            }
            var absTypeMap={personal:'事假',sick:'病假',other:'其他'};
            var todayStr=getTodayStr();
            var absRows=absRecords.map(function(r){
                var absSt=(r.endDate&&r.endDate<todayStr)?'已结束':'请假中';
                return '<tr><td data-label="班级">'+r.className+'</td>'
                    + '<td data-label="姓名">'+r.name+'</td>'
                    + '<td data-label="类型">'+(absTypeMap[r.type]||r.type)+'</td>'
                    + '<td data-label="说明">'+(r.reason||'-')+'</td>'
                    + '<td data-label="开始">'+r.startDate+'</td>'
                    + '<td data-label="结束">'+r.endDate+'</td>'
                    + '<td data-label="状态">'+absSt+'</td></tr>';
            }).join('');
            resultArea.innerHTML='<div class="card">'
                + '<div class="card-header">查询结果（请假记录 '+absRecords.length+' 条）</div>'
                + '<div style="overflow-x:auto;"><table>'
                + '<thead><tr><th>班级</th><th>姓名</th><th>请假类型</th><th>说明</th><th>开始日期</th><th>结束日期</th><th>状态</th></tr></thead>'
                + '<tbody>'+absRows+'</tbody>'
                + '</table></div></div>';
            return;
        }

        // ===== 扣分记录（原有逻辑保持不变） =====
        var startDate=f.startDate, endDate=f.endDate, className=f.className, dormRoom=f.dormRoom, bed=f.bed, studentName=f.studentName;
        var records = DB.deductionRecords.filter(function(r) {
            if (r.recordDate < startDate || r.recordDate > endDate) return false;
            var student = r.studentId ? getStudentById(r.studentId) : null;
            var dorm = getDormitoryById(r.dormitoryId);
            if (className && getClassNameForRecord(r) !== className) return false;
            if (dormRoom && (!dorm || dorm.roomNumber !== dormRoom)) return false;
            if (bed && (!student || student.bedNumber !== bed)) return false;
            if (studentName && (!student || student.name !== studentName)) return false;
            return true;
        });

        records.sort(function(a, b) {
            var dateCompare = a.recordDate.localeCompare(b.recordDate);
            if (dateCompare !== 0) return dateCompare;
            var dormA = getDormitoryById(a.dormitoryId);
            var dormB = getDormitoryById(b.dormitoryId);
            var roomA = dormA ? dormA.roomNumber : '';
            var roomB = dormB ? dormB.roomNumber : '';
            var roomCompare = roomA.localeCompare(roomB);
            if (roomCompare !== 0) return roomCompare;
            var bedA = getBedNumberForSort(a);
            var bedB = getBedNumberForSort(b);
            return bedA - bedB;
        });

        var resultArea = document.getElementById('queryResultArea');
        if (!resultArea) return;

        if (records.length === 0) {
            resultArea.innerHTML = '<div class="card"><div class="card-header">查询结果</div><div class="card-body"><div class="empty-state">暂无符合条件的扣分记录</div></div></div>';
            return;
        }

        var tableRows = records.map(function(r) {
            var dorm = getDormitoryById(r.dormitoryId);
            var student = r.studentId ? getStudentById(r.studentId) : null;
            var hyNames = (r.hygieneItemIds || []).map(getItemNameByIdOrCustom).filter(Boolean).join('、');
            var disNames = (r.disciplineItemIds || []).map(getItemNameByIdOrCustom).filter(Boolean).join('、');
            var bedNumber = student ? (student.bedNumber || '-') : '-';
            var classNameVal = getClassNameForRecord(r);
            var studentNameVal = student ? student.name : '宿舍集体';
            return '<tr>'
                + '<td data-label="日期">' + r.recordDate + '</td>'
                + '<td data-label="宿舍号">' + getDormDisplayNameById(r.dormitoryId) + '</td>'
                + '<td data-label="床号">' + bedNumber + '</td>'
                + '<td data-label="班级">' + classNameVal + '</td>'
                + '<td data-label="学生">' + studentNameVal + '</td>'
                + '<td data-label="卫生项目">' + (hyNames || '-') + '</td>'
                + '<td data-label="卫生扣分">' + (r.hygieneScore || 0) + '</td>'
                + '<td data-label="纪律项目">' + (disNames || '-') + '</td>'
                + '<td data-label="纪律扣分">' + (r.disciplineScore || 0) + '</td>'
                + '<td data-label="备注">' + escapeHtmlAttr(r.remark || '-') + '</td>'
                + '</tr>';
        }).join('');

        resultArea.innerHTML = '<div class="card">'
            + '<div class="card-header">查询结果（' + records.length + '条记录）</div>'
            + '<div style="overflow-x:auto;"><table>'
            + '<thead><tr><th>日期</th><th>宿舍号</th><th>床号</th><th>班级</th><th>学生</th><th>卫生加扣分</th><th>卫生分值</th><th>纪律加扣分</th><th>纪律分值</th><th>备注</th></tr></thead>'
            + '<tbody>' + tableRows + '</tbody>'
            + '</table></div></div>';
    }

    function exportFilteredDataNew(){
        if(!isAdmin() && currentUser.role !== 'CLASS_ADMIN'){toast('无权限','error');return;}
        var f=getExportFilterValues();
        if(!f.startDate||!f.endDate){toast('请选择日期范围','error');return;}
        if(f.startDate>f.endDate){toast('开始日期不能晚于结束日期','error');return;}

        // ===== 退宿/停宿记录导出（字段与原退宿停宿页导出保持一致） =====
        if(f.dataType==='leave' || f.dataType==='stop'){

            var isLeave=f.dataType==='leave';

            lr.forEach(function(r){

            });
            var lBlob=new Blob([lCsv],{type:'text/csv;charset=utf-8;'});

            lLink.click();
            toast('导出成功');
            return;
        }

        // ===== 请假记录导出（班级账号仅本班，由 getExportFilterValues 强制锁定） =====
        if(f.dataType==='absence'){
            var ar=getFilteredAbsenceRecords(f);
            if(ar.length===0){toast('暂无数据','error');return;}
            var aTypeMap={personal:'事假',sick:'病假',other:'其他'};
            var tStr=getTodayStr();
            var aCsv='\uFEFF班级,姓名,请假类型,说明,开始日期,结束日期,状态\n';
            ar.forEach(function(r){
                var absSt=(r.endDate&&r.endDate<tStr)?'已结束':'请假中';
                aCsv+=r.className+','+r.name+','+(aTypeMap[r.type]||r.type)+','+(r.reason||'-')+','+r.startDate+','+r.endDate+','+absSt+'\n';
            });
            var aBlob=new Blob([aCsv],{type:'text/csv;charset=utf-8;'});
            var aLink=document.createElement('a');
            aLink.href=URL.createObjectURL(aBlob);
            aLink.download='请假记录_'+new Date().toISOString().split('T')[0]+'.csv';
            aLink.click();
            toast('导出成功');
            return;
        }

        // ===== 扣分记录导出（原有逻辑保持不变） =====
        var startDate=f.startDate, endDate=f.endDate, className=f.className, dormRoom=f.dormRoom, bed=f.bed, studentName=f.studentName;
        var records=DB.deductionRecords.filter(function(r){
            if(r.recordDate<startDate||r.recordDate>endDate) return false;
            var student=r.studentId?getStudentById(r.studentId):null;
            var dorm=getDormitoryById(r.dormitoryId);
            if(className && getClassNameForRecord(r)!==className) return false;
            if(dormRoom && (!dorm || dorm.roomNumber!==dormRoom)) return false;
            if(bed && (!student || student.bedNumber!==bed)) return false;
            if(studentName && (!student || student.name!==studentName)) return false;
            return true;
        });
        records.sort(function(a,b){
            var dateCompare=a.recordDate.localeCompare(b.recordDate);
            if(dateCompare!==0) return dateCompare;
            var dormA=getDormitoryById(a.dormitoryId); var dormB=getDormitoryById(b.dormitoryId);
            var roomA=dormA?dormA.roomNumber:''; var roomB=dormB?dormB.roomNumber:'';
            var roomCompare=roomA.localeCompare(roomB);
            if(roomCompare!==0) return roomCompare;
            var bedA=getBedNumberForSort(a); var bedB=getBedNumberForSort(b);
            return bedA-bedB;
        });
        var csv='\uFEFF日期,宿舍号,床号,班级,学生,卫生加扣分,扣分值,纪律加扣分,扣分值,备注\n';
        records.forEach(function(r){
            var dorm=getDormitoryById(r.dormitoryId);
            var student=r.studentId?getStudentById(r.studentId):null;
            var hyNames=(r.hygieneItemIds||[]).map(getItemNameByIdOrCustom).filter(Boolean).join('、');
            var disNames=(r.disciplineItemIds||[]).map(getItemNameByIdOrCustom).filter(Boolean).join('、');
            var bedNumber=student?(student.bedNumber||'-'):'-';
            var classNameVal=getClassNameForRecord(r);
            var studentNameVal=student?student.name:'宿舍集体';
            csv+=r.recordDate+','+getDormDisplayNameById(r.dormitoryId)+','+bedNumber+','+classNameVal+','+studentNameVal+','+(hyNames||'-')+','+(r.hygieneScore||0)+','+(disNames||'-')+','+(r.disciplineScore||0)+','+escapeHtmlAttr(r.remark||'').replace(/,/g,'，')+'\n';
        });
        var fileName;
        if(startDate===endDate && !className && !dormRoom && !bed && !studentName){
            fileName = startDate+'宿舍管理情况登记表';
        } else if(className && !studentName && !dormRoom && !bed){
            fileName = className+'宿舍管理情况登记表';
        } else if(studentName){
            fileName = studentName+'宿舍管理情况登记表';
        } else {
            var weekNum = getWeekNumber(startDate);
            fileName = '第'+weekNum+'周宿舍管理情况登记表';
        }
        var blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
        var link=document.createElement('a');
        link.href=URL.createObjectURL(blob);
        link.download=fileName+'.csv';
        link.click();
        toast('导出成功');
    }
    function getWeekNumber(dateStr){
        var refDate = new Date('2026-08-28');
        var date = new Date(dateStr);
        var diffDays = Math.floor((date - refDate) / (1000*60*60*24));
        if(diffDays<0) return 1;
        return Math.floor(diffDays/7)+1;
    }

    // ==================== PWA: Service Worker 注册 ====================
    // 独立代码块，不嵌套在应用 DOMContentLoaded 中，避免影响初始化
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
            navigator.serviceWorker.register('./sw.js')
                .then(function(reg) {
                    console.log('✅ Service Worker 注册成功', reg.scope);
                    // 版本更新时自动激活新 SW
                    if (reg.waiting) reg.waiting.postMessage({type:'SKIP_WAITING'});
                    reg.addEventListener('updatefound', function() {
                        var installing = reg.installing;
                        installing.addEventListener('statechange', function() {
                            if (installing.state === 'installed' && navigator.serviceWorker.controller) {
                                installing.postMessage({type:'SKIP_WAITING'});
                            }
                        });
                    });
                })
                .catch(function(err) {
                    console.warn('⚠️ Service Worker 注册失败（仅影响离线能力）:', err.message);
                });
        });
    }
    </script>
</body>
</html>
