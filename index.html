                padding-right:34px;

            .stat-cards-mobile .stat-item{background:#f8f9fc;border-radius:10px;padding:10px 4px;text-align:center;border:1px solid #e5e7eb}

            /* 扣分项改为半宽大触控芯片 */
            .checkbox-group{gap:8px;padding:0;border:none;min-height:0}

                width:calc(50% - 4px);

            .checkbox-group label:has(input:checked){background:var(--primary-light);border-color:var(--primary)}
            .checkbox-group span[id$="CustomInputWrap"]{width:100%}

            /* 卡片 */
            .card-header{padding:12px 14px;font-size:1rem}
            .card-body{padding:14px}
            .item-list .item-row{padding:12px 0}

            /* Toast 居中显示 */
            #toast{left:16px;right:16px;top:calc(64px + var(--sat));display:flex;flex-direction:column;align-items:center}
            .toast-item{width:100%;max-width:420px;text-align:center;padding:12px 16px;font-size:1rem}

            .content-header h2{font-size:1.2857rem}
            .empty-state{padding:28px 12px}

            /* ===== 字体调节面板（仅STAFF移动端） ===== */
            .font-scale-btn{
                display:none;
                min-width:44px;height:44px;
                background:var(--gray-100);border:1px solid var(--gray-200);

                align-items:center;justify-content:center;
            }
            .font-scale-panel{
                display:none;
                position:fixed;top:calc(64px + var(--sat));right:12px;
                background:#fff;border-radius:12px;

                padding:14px 16px;z-index:1400;

            }
            .font-scale-panel.show{display:block}
            .font-scale-panel .fsp-title{font-size:0.9286rem;font-weight:700;color:var(--gray-800);margin-bottom:10px;text-align:center}
            .font-scale-panel .fsp-row{display:flex;align-items:center;justify-content:center;gap:12px}
            .font-scale-panel .fsp-btn{
                width:44px;height:44px;border-radius:10px;
                border:1.5px solid var(--gray-200);background:var(--gray-50);
                font-size:1.1429rem;font-weight:700;cursor:pointer;
                color:var(--primary);display:flex;align-items:center;justify-content:center;
            }
            .font-scale-panel .fsp-btn:active{background:var(--primary-light)}
            .font-scale-panel .fsp-value{font-size:1.1429rem;font-weight:700;color:var(--gray-800);min-width:56px;text-align:center}
            .font-scale-panel .fsp-reset{
                width:100%;margin-top:10px;padding:8px;
                background:var(--gray-100);border:1px solid var(--gray-200);
                border-radius:8px;font-size:0.8571rem;cursor:pointer;color:var(--gray-600);
            }
            .font-scale-panel .fsp-reset:active{background:var(--gray-200)}

            /* 防溢出：字体放大后长文本自动换行 */
            body{overflow-wrap:break-word;word-break:break-word}
            .card-body,.card-header,.stat-card,.stat-item,.mem-row,.dorm-row-mobile,
            .form-group,.table-wrap,.tree-room,.tree-floor-header,.chip,
            .toast-item,.content-area{overflow-wrap:break-word;word-break:break-word}
            .mem-sub,.dorm-row-mobile .rank-item .rank-value,.dorm-row-mobile .d-class{min-width:0}
        }
    </style>
</head>
<body>

    <script>
    // ==================== 配置 ====================
    var SUPABASE_CONFIG = {
        url: 'https://pburnvnfzwoyfxktqfho.supabase.co',
        anonKey: 'sb_publishable_sO8GOS5fm-k76SA7zZz0yQ_aSQkYg2u',
        enabled: true
    };
    var DB_KEY = 'dormitory_system_v10';
    var DB = null;
    var currentUser = null;
    var currentView = 'hierarchy';
    var selectedFloorId = null;
    var selectedDormitoryId = null;
    var supabaseClient = null;
    var syncEnabled = false;
    // 设备标识：用于生成全局唯一的记录ID（多设备并发登记互不冲突）
    var DEVICE_ID=(function(){ try{ var k='dorm_device_id'; var v=localStorage.getItem(k); if(!v){ v=Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4); localStorage.setItem(k,v);} return v; }catch(e){ return 'nos'; } })();

    // ==================== 移动端历史栈 ====================
    var viewHistory = [];

    // ==================== 学生名单检索状态 ====================
    var studentSearch = { className: '', name: '', residence: '' };

    // ==================== 数据访问辅助函数 ====================
    function getFloorById(id) {
        if (!DB || !DB.floors) return null;
        return DB.floors.find(function(f) { return f.id === id; }) || null;
    }

    function getDormitoryById(id) {
        if (!DB || !DB.dormitories) return null;
        return DB.dormitories.find(function(d) { return d.id === id; }) || null;
    }

    function getDormitoriesByFloor(floorId) {
        if (!DB || !DB.dormitories) return [];
        // 仅返回 dormitoryList 中的生效宿舍号；被删除的宿舍不再出现在选择列表中
        var activeSet = {};
        (DB.dormitoryList || []).forEach(function(r){ activeSet[String(r)] = true; });
        return DB.dormitories.filter(function(d) {
            return d.floorId === floorId && activeSet[String(d.roomNumber)];
        });
    }
    // 判断宿舍号是否已被删除（用于历史记录显示）
    // 修复：若该宿舍仍有学生入住，视为未删除（数据一致性兜底）
    function isDormitoryDeleted(roomNumber){
        if(!DB || !Array.isArray(DB.dormitoryList)) return false;
        if(DB.dormitoryList.indexOf(String(roomNumber)) !== -1) return false;
        // 宿舍号不在 dormitoryList，但有学生入住 → 视为有效宿舍（导入遗漏修复）
        var dorm = getDormitoryByRoomNumber(roomNumber);
        if(dorm && getStudentsByDormitory(dorm.id).length > 0) return false;
        return true;
    }
    // 通过宿舍ID获取显示名称：已删除的宿舍号标注 [已删除]
    function getDormDisplayNameById(dormitoryId){
        var d = getDormitoryById(dormitoryId);
        if(!d) return '-';
        return isDormitoryDeleted(d.roomNumber) ? (d.roomNumber + '[已删除]') : d.roomNumber;
    }
    // 历史记录中宿舍号快照的显示（已删除标注）
    function getDormSnapshotDisplay(roomNumber){
        if(!roomNumber) return '-';
        return isDormitoryDeleted(roomNumber) ? (roomNumber + '[已删除]') : roomNumber;
    }
    // 通过宿舍号查找 dormitory（含已删除的，用于历史数据回显）
    function getDormitoryByRoomNumber(roomNumber){
        if(!DB || !DB.dormitories) return null;
        return DB.dormitories.find(function(d){ return String(d.roomNumber) === String(roomNumber); }) || null;
    }
    // 获取排序后的生效宿舍号列表（按楼层优先、宿舍号从小到大：101,102,...,201,202...）
    // className 非空时仅返回该班级学生入住的宿舍号
    function getSortedDormNumbers(className){
        var set = {};
        if(className){
            DB.students.forEach(function(s){
                if(s.className !== className || s.dormitoryId == null) return;
                var d = getDormitoryById(s.dormitoryId);
                if(d) set[String(d.roomNumber)] = true;
            });
        } else {
            (DB.dormitoryList || []).forEach(function(r){ set[String(r)] = true; });
        }
        return Object.keys(set).sort(function(a, b){ return parseInt(a, 10) - parseInt(b, 10); });
    }
    // 生成宿舍号 select 选项 HTML
    function dormSelectOptions(className, selectedVal){
        var nums = getSortedDormNumbers(className);
        var opts = '<option value="">请选择宿舍</option>';
        nums.forEach(function(n){ opts += '<option value="'+n+'"'+(n===selectedVal?' selected':'')+'>'+n+'</option>'; });
        return opts;
    }
    // 获取某宿舍已占用的床号
    function getOccupiedBeds(dormitoryId){
        var beds = {};
        getStudentsByDormitory(dormitoryId).forEach(function(s){ if(s.bedNumber) beds[String(s.bedNumber)] = true; });
        return beds;
    }
    // 生成床号 select 选项 HTML（1-8，已占用的标注"已满"并禁用）
    function bedSelectOptions(dormitoryId, selectedVal, excludeStudentId){
        var opts = '<option value="">请选择床号</option>';
        var occupied = {};
        if(dormitoryId){
            getStudentsByDormitory(dormitoryId).forEach(function(s){
                if(excludeStudentId && s.id === excludeStudentId) return;
                if(s.bedNumber) occupied[String(s.bedNumber)] = true;
            });
        }
        for(var b = 1; b <= 8; b++){
            var bstr = String(b);
            var disabled = occupied[bstr] ? ' disabled' : '';
            var label = occupied[bstr] ? (b+'（已满）') : String(b);
            opts += '<option value="'+bstr+'"'+(bstr===selectedVal?' selected':'')+disabled+'>'+label+'</option>';
        }
        return opts;
    }

    function getStudentById(id) {
        if (!DB || !DB.students) return null;
        return DB.students.find(function(s) { return s.id === id; }) || null;
    }

    function getStudentsByDormitory(dormitoryId) {
        if (!DB || !DB.students) return [];

    // 判断是否为非住宿生（走读生）：dormitoryId 为 null 或未定义
    function isNonResidentStudent(student){

    }
    // 获取住宿学生列表（排除走读生），用于住宿信息/扣分登记等场景
    function getResidentStudents(className){
        if(!DB||!Array.isArray(DB.students)) return [];
        return DB.students.filter(function(s){
            if(s.dormitoryId == null) return false;
            if(className && s.className !== className) return false;
            return true;
        });

    function getRecordsByDormitory(dormitoryId) {
        if (!DB || !DB.deductionRecords) return [];
        return DB.deductionRecords.filter(function(r) { return r.dormitoryId === dormitoryId; });

        if (!DB || !DB.deductionRecords || !DB.dormitories) return [];
        var dormIds = getDormitoriesByFloor(floorId).map(function(d) { return d.id; });
        return DB.deductionRecords.filter(function(r) { return dormIds.indexOf(r.dormitoryId) !== -1; });
    }

    function getTotalScore(records) {
        if (!records) return 0;
        var total = 0;
        records.forEach(function(r) {
            total += (r.hygieneScore || 0) + (r.disciplineScore || 0);
        });
        // 消除 0.2 分自定义项累加产生的浮点尾差（如 14.600000000000001）
        return Math.round(total * 10) / 10;
    }

    function getItemById(id) {
        if (!DB || !DB.deductionItems) return null;
        var allItems = (DB.deductionItems.hygiene || []).concat(DB.deductionItems.discipline || []);
        return allItems.find(function(item) { return item.id === id; }) || null;
    }

    function getItemNameByIdOrCustom(id) {
        if (typeof id === 'string' && id.startsWith('custom:')) {

        return item ? item.name : '';

    // 班级名称排序：先按前缀（非数字部分）分组，再按数字升序（三1、三2……三31），
    // 兼容"三1"与"高一1班"等多种格式混排（纯数字提取会把不同年级的同号班级混在一起）
    function sortClassNames(list) {
        return list.slice().sort(function(a, b) {
            var pa = String(a).replace(/[0-9]+/g, ''), pb = String(b).replace(/[0-9]+/g, '');
            if (pa !== pb) return pa.localeCompare(pb, 'zh-Hans-CN');
            var na = parseInt(String(a).replace(/[^0-9]/g, '')) || 0;
            var nb = parseInt(String(b).replace(/[^0-9]/g, '')) || 0;
            if (na !== nb) return na - nb;
            return String(a).localeCompare(String(b), 'zh-Hans-CN');
        });
    }

    function getDormitoryClassName(dormitoryId) {
        var students = getStudentsByDormitory(dormitoryId);
        if (students.length === 0) return '-';
        var classSet = {};
        students.forEach(function(s) { if (s.className) classSet[s.className] = true; });
        var keys = Object.keys(classSet);
        return keys.length > 0 ? keys.join('/') : '-';
    }

    function getClassNameForRecord(record) {
        if (record.studentId) {
            var student = getStudentById(record.studentId);
            return student ? student.className || '-' : '-';
        }
        var dorm = getDormitoryById(record.dormitoryId);
        if (!dorm) return '-';
        return getDormitoryClassName(dorm.id);
    }

    function getBedNumberForSort(record) {
        if (record.studentId) {
            var student = getStudentById(record.studentId);
            return student ? parseInt(student.bedNumber) || 999 : 999;
        }
        return 999;
    }

    function getClassDormIds() {

    function filterRecordsByClass(records) {
        if (!isClassAdmin()) return records;

    // ==================== 本地存储（含压缩回退 + 容量预警） ====================
    var LOCAL_LZ_PREFIX = 'LZC1:';   // 本地压缩存储标记（compressToUTF16，localStorage 按 UTF-16 计长，密度最高）
    var CLOUD_LZ_PREFIX = 'LZC1B:';  // 云端压缩存储标记（compressToBase64，纯 ASCII，HTTP/UTF-8 传输无膨胀）
    var STORAGE_WARN_BYTES = 4 * 1024 * 1024; // 本地数据 4MB 预警阈值
    var storageWarned = false;
    function getDBByteSize() {
        try { return new Blob([JSON.stringify(DB)]).size; } catch(e) { return 0; }
    }
    function checkStorageWarning() {
        if (storageWarned || !DB) return;
        var size = getDBByteSize();
        if (size > STORAGE_WARN_BYTES) {
            storageWarned = true;
            var mb = (size / 1024 / 1024).toFixed(2);
            console.warn('[存储预警] 本地数据约 ' + mb + 'MB，已接近 localStorage 5MB 上限，建议清理历史记录');
            // 延迟弹出，避开启动加载遮罩
            setTimeout(function () {
                toast('数据量较大（' + mb + 'MB），建议联系管理员清理历史记录', 'error');
            }, 1200);
        }
    }

    function loadDBFromLocal() {
        try {
            var stored = localStorage.getItem(DB_KEY);
            if (!stored) return false;
            var json = null;
            if (stored.charAt(0) === '{' || stored.charAt(0) === '[') {
                json = stored; // 旧格式：明文 JSON
            } else if (stored.indexOf(LOCAL_LZ_PREFIX) === 0) {
                // 新格式：压缩存储（本地空间不足时的回退）
                if (!window.LZString) { console.error('本地数据为压缩格式但 lz-string 未加载'); return false; }
                json = LZString.decompressFromUTF16(stored.slice(LOCAL_LZ_PREFIX.length));
                if (!json) { console.error('本地压缩数据解压失败，数据可能已损坏'); return false; }
            }
            if (json) {
                DB = JSON.parse(json);
                if (DB && DB.users && DB.floors && DB.dormitories && DB.students && DB.deductionItems && DB.deductionRecords && DB.leaveRecords && DB.nextIds) {
                    checkStorageWarning();
                    return true;
                }
            }
        } catch(e) {
            console.error('读取本地数据失败:', e);
        }
        return false;
    }
    function saveDBToLocal() {
        var json;
        try {
            json = JSON.stringify(DB);
        } catch(e) { console.error('数据序列化失败:', e); return; }
        try {
            localStorage.setItem(DB_KEY, json);
        } catch(e) {
            // QuotaExceededError：明文超限，回退为压缩存储
            console.warn('本地存储写入失败（空间不足），尝试压缩存储:', e);
            if (!window.LZString) {
                toast('本地存储空间已满，请清理历史记录', 'error');
                return;
            }
            try {
                localStorage.setItem(DB_KEY, LOCAL_LZ_PREFIX + LZString.compressToUTF16(json));
                console.warn('已启用本地压缩存储，建议尽快清理历史记录');
                toast('本地存储空间紧张，已自动压缩存储，建议清理历史记录', 'error');
            } catch(e2) {
                console.error('压缩存储仍失败:', e2);
                toast('本地存储空间已满，请联系管理员清理历史记录', 'error');
            }
        }
    }
    function isValidDB(db) {

    // ==================== 增量同步：元数据与记录ID ====================
    // 确保同步元数据存在（旧本地数据自动迁移）
    function ensureSyncMeta(){
        if(!DB) return;
        if(!Array.isArray(DB.syncedRecordIds)) DB.syncedRecordIds=[];
        if(!Array.isArray(DB.deletedRecordIds)) DB.deletedRecordIds=[];
        if(!Array.isArray(DB.dirtyRecordIds)) DB.dirtyRecordIds=[];
        if(typeof DB.lastSyncTime!=='number') DB.lastSyncTime=0;
        // V3 按行存储：按类型分组的脏标记和删除标记
        if(!DB.dirtyByType) DB.dirtyByType = {};
        if(!DB.deletedByType) DB.deletedByType = {};
        V3_RECORD_TYPES.forEach(function(m){
            if(!DB.dirtyByType[m.type]) DB.dirtyByType[m.type] = {};
            if(!DB.deletedByType[m.type]) DB.deletedByType[m.type] = {};
        });
        if(!Array.isArray(DB.absenceRecords)) DB.absenceRecords=[];
        if(!DB.nextIds) DB.nextIds={};
        if(typeof DB.nextIds.absence!=='number') DB.nextIds.absence=1;
        // dormitoryList：生效宿舍号列表；旧数据缺失时从 dormitories 重建
        if(!Array.isArray(DB.dormitoryList) || DB.dormitoryList.length===0){
            DB.dormitoryList = (DB.dormitories||[]).map(function(d){ return String(d.roomNumber); });
        }
        // 兜底：确保 dormitories 中存在但不在 dormitoryList 的历史宿舍不会被误删，
        // 同时移除 dormitoryList 中已不存在于 dormitories 的脏条目
        var existingRooms = {};
        (DB.dormitories||[]).forEach(function(d){ existingRooms[String(d.roomNumber)] = true; });
        DB.dormitoryList = DB.dormitoryList.filter(function(r){ return existingRooms[String(r)]; });
        // 数据一致性修复：所有有学生入住的宿舍号必须在 dormitoryList 中（防止"已删除"误标）
        (DB.students||[]).forEach(function(s){
            if(s.dormitoryId == null) return;
            var d = (DB.dormitories||[]).find(function(x){ return x.id === s.dormitoryId; });
            if(d){
                var rn = String(d.roomNumber);
                if(DB.dormitoryList.indexOf(rn) === -1) DB.dormitoryList.push(rn);
            }
        });
        // 退宿停宿记录字段迁移：补齐 status / studentId / startDate / endDate（兼容历史数据）
        if(Array.isArray(DB.leaveRecords)){
            var todayStr=new Date().toISOString().split('T')[0];
            DB.leaveRecords.forEach(function(r){
                if(!r.status) r.status='approved';            // 旧记录视为已生效
                if(!r.studentId){
                    var m=matchStudentBySnapshot(r.className,r.name,r.dormitory,r.bed);
                    if(m) r.studentId=m.id;
                }
                if(r.type==='stop' && !r.startDate && typeof r.date==='string'){
                    var parts=r.date.split('至');
                    if(parts.length===2){ r.startDate=parts[0].trim(); r.endDate=parts[1].trim(); }
                    else { r.startDate=r.date; r.endDate=r.date; }
                }
                if(r.type==='leave' && !r.startDate){ r.startDate=r.date; r.endDate=r.date; }
            });
        }
    }
    // 基础数据自愈：楼层/宿舍被历史 bug（云端空数据覆盖本地）意外清空时按默认结构重建，
    // 并标记为脏以便上传云端补种，其他设备拉取后自动恢复。
    // 楼层/宿舍在 UI 上无新增入口且永远不会被整类删除，"为空"必然意味着数据损坏，重建是安全的
    function repairBasicData(){
        if(!DB) return false;
        var repaired = false;
        var floorsRepaired = false;
        ensureSyncMeta();
        // 1) 楼层：固定 8 层（id 1-8，与 initDatabase 默认结构一致）
        if(!Array.isArray(DB.floors) || DB.floors.length === 0){
            var floorNames = ['一楼','二楼','三楼','四楼','五楼','六楼','七楼','八楼'];
            DB.floors = [];
            for(var i = 1; i <= 8; i++){
                DB.floors.push({ id: i, name: floorNames[i-1], sortOrder: i });
                v3MarkDirty('floor', i);
            }
            repaired = true;
            floorsRepaired = true;
            console.log('[修复] 楼层数据为空，已重建默认 8 层');
        }
        // 2) 宿舍：优先按 dormitoryList 恢复已有宿舍号；dormitoryList 也为空时按默认结构（每层 20 间 + 723/322/323）
        if(!Array.isArray(DB.dormitories) || DB.dormitories.length === 0){
            var rooms = [];
            if(Array.isArray(DB.dormitoryList) && DB.dormitoryList.length > 0){
                DB.dormitoryList.forEach(function(rn){ rooms.push(String(rn)); });
            } else {
                for(var f = 1; f <= 8; f++){
                    for(var r = 1; r <= 20; r++) rooms.push(String(f * 100 + r));
                }
                rooms.push('723','322','323');
            }
            if(typeof DB.nextIds.dormitory !== 'number' || DB.nextIds.dormitory < 1) DB.nextIds.dormitory = 1;
            DB.dormitories = [];
            rooms.forEach(function(rn){
                if(!/^[1-8][0-9]{2}$/.test(rn)) return;
                var floorNum = parseInt(rn.charAt(0), 10);
                var floor = DB.floors.find(function(fl){ return fl.sortOrder === floorNum; });
                if(!floor) return;
                var newId = DB.nextIds.dormitory++;
                DB.dormitories.push({ id: newId, floorId: floor.id, roomNumber: rn, capacity: 8 });
                v3MarkDirty('dormitory', newId);
            });
            repaired = true;
            console.log('[修复] 宿舍数据为空，已按宿舍号重建 ' + DB.dormitories.length + ' 个宿舍');
        }
        // 3) 楼层重建后，按宿舍号首位重映射宿舍的 floorId 引用
        if(floorsRepaired && Array.isArray(DB.dormitories)){
            DB.dormitories.forEach(function(d){
                var rn = String(d.roomNumber || '');
                if(/^[1-8][0-9]{2}$/.test(rn)){
                    var fl = DB.floors.find(function(f2){ return f2.sortOrder === parseInt(rn.charAt(0), 10); });
                    if(fl) d.floorId = fl.id;
                }
            });
        }
        if(repaired) ensureSyncMeta(); // 重建 dormitoryList
        return repaired;
    }
    // 通过 班级+姓名+宿舍号+床号 快照匹配学生（用于给旧记录补 studentId）
    function matchStudentBySnapshot(className,name,dormitory,bed){
        if(!DB||!Array.isArray(DB.students)) return null;
        return DB.students.find(function(s){
            if(s.className!==className||s.name!==name) return false;
            var d=getDormitoryById(s.dormitoryId);
            if(dormitory && (!d||d.roomNumber!==dormitory)) return false;
            if(bed && String(s.bedNumber)!==String(bed)) return false;
            return true;
        })||null;
    }
    // 记录ID全局唯一（方案B）：时间戳(base36) + 设备标识 + 随机后缀，杜绝多设备 nextIds 冲突
    function generateRecordId(){
        return Date.now().toString(36)+'-'+DEVICE_ID+'-'+Math.random().toString(36).slice(2,6);
    }

    // ==================== V3 按行存储架构：常量与辅助 ====================
    // 业务记录类型 → DB 中对应数组的映射。
    // 注意 deductionItems 是 {hygiene:[], discipline:[]} 对象，需要特殊处理。
    var V3_RECORD_TYPES = [
        { type: 'meta',            dbPath: ['meta'],              idField: 'id',    isArray: false, specialMeta: true },
        { type: 'floor',            dbPath: ['floors'],           idField: 'id',    isArray: true  },
        { type: 'dormitory',        dbPath: ['dormitories'],      idField: 'id',    isArray: true  },
        { type: 'student',          dbPath: ['students'],         idField: 'id',    isArray: true  },
        { type: 'user',             dbPath: ['users'],            idField: 'id',    isArray: true  },
        { type: 'deduction_item',   dbPath: ['deductionItems'],   idField: 'id',    isArray: false, specialItems: true },
        { type: 'deduction_record', dbPath: ['deductionRecords'], idField: 'id',    isArray: true  },
        { type: 'leave_record',     dbPath: ['leaveRecords'],     idField: 'id',    isArray: true  },
        { type: 'absence_record',   dbPath: ['absenceRecords'],   idField: 'id',    isArray: true  }
    ];
    // 基础数据类型（管理员统一维护，云端为权威）——拉取时云端覆盖本地
    var V3_BASIC_TYPES = ['meta', 'floor', 'dormitory', 'student', 'user', 'deduction_item'];
    // 业务记录类型（多设备并发写入，按 updated_at 合并）
    var V3_MUTABLE_TYPES = ['deduction_record', 'leave_record', 'absence_record'];
    // Supabase upsert 批量上限（保守值，实际约 500）
    var V3_UPSERT_CHUNK = 200;
    // 表结构版本：2 = 旧版整库压缩，3 = 新版按行存储
    var V3_SCHEMA_VERSION = 3;
    // 运行时检测到的表结构版本，initializeData 中设置
    var _detectedSchemaVersion = 2;

    // 从 DB 获取某类型的记录数组（处理 deductionItems 的嵌套结构）
    function v3GetRecordsByType(type){
        var meta = V3_RECORD_TYPES.find(function(m){ return m.type === type; });
        if(!meta || !DB) return [];
        if(meta.specialMeta){
            // meta 类型：固定返回一条 {id:'main', data:{...}}
            return [{ id: 'main', dormitoryList: DB.dormitoryList || [], nextIds: DB.nextIds || {} }];
        }
        if(meta.specialItems){
            // deductionItems: 扁平化 hygiene + discipline 为独立记录
            var arr = [];
            var hy = (DB.deductionItems&&DB.deductionItems.hygiene)||[];
            var dis = (DB.deductionItems&&DB.deductionItems.discipline)||[];
            hy.forEach(function(x){ arr.push({ _subType:'hygiene', data:x }); });
            dis.forEach(function(x){ arr.push({ _subType:'discipline', data:x }); });
            return arr;
        }
        return (DB[meta.dbPath[0]]) || [];
    }
    // 将一条云端 deduction_item 记录还原到 DB.deductionItems
    function v3RestoreDeductionItem(cloudRow){
        var st = (cloudRow.data && cloudRow.data._subType) || cloudRow._subType;
        if(!DB.deductionItems) DB.deductionItems = { hygiene: [], discipline: [] };
        var target = DB.deductionItems[st] || (st==='discipline' ? DB.deductionItems.discipline : DB.deductionItems.hygiene);
        var itemData = cloudRow.data || cloudRow;
        // 移除辅助字段
        var clean = {};
        Object.keys(itemData).forEach(function(k){ if(k !== '_subType') clean[k] = itemData[k]; });
        // 检查是否已存在（同 id）
        var idx = target.findIndex(function(x){ return String(x.id) === String(clean.id); });
        if(idx >= 0) target[idx] = clean;
        else target.push(clean);
    }

    // 脏标记：按 type 分组存储 DB.dirtyByType[type] = { recordId: true, ... }
    // 删除标记：按 type 分组存储 DB.deletedByType[type] = { recordId: true, ... }
    function v3MarkDirty(type, recordId){
        if(!DB) return;
        if(!DB.dirtyByType) DB.dirtyByType = {};
        if(!DB.dirtyByType[type]) DB.dirtyByType[type] = {};
        DB.dirtyByType[type][String(recordId)] = true;
    }
    function v3MarkDeleted(type, recordId){
        if(!DB) return;
        if(!DB.deletedByType) DB.deletedByType = {};
        if(!DB.deletedByType[type]) DB.deletedByType[type] = {};
        DB.deletedByType[type][String(recordId)] = true;
        // 已删除的记录同时从 dirty 标记中移除（避免删除标记和脏标记冲突）
        if(DB.dirtyByType && DB.dirtyByType[type]){
            delete DB.dirtyByType[type][String(recordId)];
        }
    }
    function v3IsDirty(type, recordId){
        return DB && DB.dirtyByType && DB.dirtyByType[type] && DB.dirtyByType[type][String(recordId)];
    }
    function v3IsDeleted(type, recordId){
        return DB && DB.deletedByType && DB.deletedByType[type] && DB.deletedByType[type][String(recordId)];
    }
    // 将本地某类型的所有现有记录标记为脏（用于云端缺失该类型数据时的补种上传）
    function v3MarkTypeDirty(type){
        if(!DB) return 0;
        var meta = V3_RECORD_TYPES.find(function(m){ return m.type === type; });
        if(!meta) return 0;
        ensureSyncMeta();
        var count = 0;
        if(meta.specialMeta){
            // meta 类型：固定 id='main'
            v3MarkDirty('meta', 'main');
            return 1;
        }
        if(meta.specialItems){
            // deductionItems：扁平化 hygiene + discipline
            var hy = (DB.deductionItems&&DB.deductionItems.hygiene)||[];
            var dis = (DB.deductionItems&&DB.deductionItems.discipline)||[];
            hy.forEach(function(x){ if(x && x.id!=null){ v3MarkDirty('deduction_item', x.id); count++; } });
            dis.forEach(function(x){ if(x && x.id!=null){ v3MarkDirty('deduction_item', x.id); count++; } });
            return count;
        }
        // 普通数组类型
        var arr = DB[meta.dbPath[0]] || [];
        arr.forEach(function(x){ if(x && x[meta.idField]!=null){ v3MarkDirty(meta.type, x[meta.idField]); count++; } });
        return count;
    }
    // V3 首次升级后：把本地所有已有记录标记为脏，触发全量上传
    // （因为旧 V2 架构下的记录没有 V3 脏标记，syncToCloudV3 不会上传它们）
    function v3MarkAllLocalDirty(){
        if(!DB) return;
        var count = 0;
        V3_RECORD_TYPES.forEach(function(meta){
            count += v3MarkTypeDirty(meta.type);
        });
        if(count > 0){
            console.log('[V3] 首次升级：已将本地 '+count+' 条记录标记为脏，等待全量上传');
        }
    }

    // 检测 sync_store 表是否已升级为 V3 按行存储结构（有 record_type 等列）
    function detectV3Schema(){
        if(!supabaseClient) return Promise.resolve(2);
        if(_detectedSchemaVersion === 3) return Promise.resolve(3);
        // 用 try-catch 查询新字段，成功则 V3，失败则 V2
        return supabaseClient.from('sync_store').select('id,record_type,record_id').limit(1).then(function(res){
            if(res.error){
                // 列不存在或其他错误 → 旧结构
                console.log('[V3] 检测到旧表结构，使用 V2 同步：', res.error.message);
                _detectedSchemaVersion = 2;
                return 2;
            }
            console.log('[V3] 检测到 V3 按行存储表结构');
            _detectedSchemaVersion = 3;
            return 3;
        }).catch(function(){
            _detectedSchemaVersion = 2;
            return 2;
        });
    }

    function syncToCloudV3(){
        if (!syncEnabled || !supabaseClient || !DB) return Promise.resolve(false);
        ensureSyncMeta();
        var rows = [];
        var nowIso = new Date().toISOString();
        var didAnything = false;
        // 遍历所有记录类型，收集脏记录和删除标记
        V3_RECORD_TYPES.forEach(function(meta){
            var dirtySet = (DB.dirtyByType && DB.dirtyByType[meta.type]) || {};
            var deletedSet = (DB.deletedByType && DB.deletedByType[meta.type]) || {};
            // 1) 脏记录：从 DB 读取当前数据，构造 upsert 行
            Object.keys(dirtySet).forEach(function(rid){
                var rec = v3GetRecordById(meta.type, rid);
                if(!rec) return; // 记录不存在了（可能已被删除），交给 deleted 处理
                didAnything = true;
                rows.push(v3BuildUpsertRow(meta.type, rid, rec, false, nowIso));
            });
            // 2) 删除标记：只对已存在的云端记录设置 deleted=true
            Object.keys(deletedSet).forEach(function(rid){
                didAnything = true;
                rows.push(v3BuildUpsertRow(meta.type, rid, null, true, nowIso));
            });
        });
        if(!didAnything){
            console.log('[V3] 无脏记录需要上传');
            DB.lastSyncTime = Date.now();
            return Promise.resolve(true);
        }
        // 先删后插：逐行 DELETE (record_type,record_id) 再 INSERT 新数据
        // 绕开 PostgREST upsert 和自增序列问题
        function uploadOne(row){
            // 1. 先删除同 (record_type, record_id) 的旧行
            return supabaseClient.from('sync_store')
                .delete()
                .eq('record_type', row.record_type)
                .eq('record_id', row.record_id)
                .then(function(){
                    // 2. 再插入新行（显式大 id，绕开序列）
                    return supabaseClient.from('sync_store').insert([row]);
                });
        }
        function doBatch(startIdx){
            if(startIdx >= rows.length) return Promise.resolve(true);
            var chunk = rows.slice(startIdx, startIdx + V3_UPSERT_CHUNK);
            return Promise.all(chunk.map(uploadOne)).then(function(results){
                var fail = results.find(function(r){ return r.error; });
                if(fail){ console.error('[V3] 上传批次失败:', fail.error.message); return false; }
                return doBatch(startIdx + V3_UPSERT_CHUNK);
            });
        }
        return doBatch(0).then(function(ok){
            if(!ok) return false;
            // 上传成功：清除脏标记和删除标记
            V3_RECORD_TYPES.forEach(function(meta){
                if(DB.dirtyByType && DB.dirtyByType[meta.type]) DB.dirtyByType[meta.type] = {};
                if(DB.deletedByType && DB.deletedByType[meta.type]) DB.deletedByType[meta.type] = {};
            });
            DB.lastSyncTime = Date.now();
            saveDBToLocal();
            console.log('[V3] 上传成功，共 ' + rows.length + ' 行');
            return true;
        });
    }
    // 从 DB 获取指定类型的记录（支持 deductionItems 特殊处理）
    function v3GetRecordById(type, recordId){
        var meta = V3_RECORD_TYPES.find(function(m){ return m.type === type; });
        if(!meta || !DB) return null;
        var rid = String(recordId);
        if(meta.specialMeta){
            // meta 类型：固定 id 为 'main'
            if(rid === 'main') return { id: 'main', dormitoryList: DB.dormitoryList || [], nextIds: DB.nextIds || {} };
            return null;
        }
        if(meta.specialItems){
            // deductionItems：先搜 hygiene 再搜 discipline，附带 _subType
            var hy = (DB.deductionItems&&DB.deductionItems.hygiene)||[];
            var dis = (DB.deductionItems&&DB.deductionItems.discipline)||[];
            var found = hy.find(function(x){ return String(x.id) === rid; });
            if(found) return Object.assign({}, found, { _subType: 'hygiene' });
            found = dis.find(function(x){ return String(x.id) === rid; });
            if(found) return Object.assign({}, found, { _subType: 'discipline' });
            return null;
        }
        var arr = DB[meta.dbPath[0]] || [];
        return arr.find(function(x){ return String(x[meta.idField]) === rid; }) || null;
    }
    // V3 行主键生成：固定前缀(13位) + 毫秒窗口(9位) + 同批次序列号(6位)
    // 旧方案 1000000+Date.now()%1e7+random(1000)：同批大量行并行插入时同毫秒撞随机数概率极高，
    // 导致主键冲突整批失败。新方案序列号在同一毫秒内支持百万行严格唯一（单次同步全量行也安全），
    // 极端跨设备"同毫秒+同序列"冲突概率约零且由上传重试自愈
    var _v3RowSeq = 0;
    function v3NewRowId(){
        _v3RowSeq = (_v3RowSeq + 1) % 1000000;
        // 上限 1e13 + 999999999*1e6 + 999999 ≈ 1.0009e15 < Number.MAX_SAFE_INTEGER，JSON 序列化无损
        return 10000000000000 + (Date.now() % 1000000000) * 1000000 + _v3RowSeq;
    }
    // 构造 sync_store upsert 行
    function v3BuildUpsertRow(recordType, recordId, data, isDeleted, updatedAt){
        // 显式分配大 id，绕开数据库自增序列被旧数据卡死的问题
        var bigId = v3NewRowId();
        return {
            id: bigId,
            record_type: recordType,
            record_id: String(recordId),
            data: isDeleted ? {} : data,
            deleted: !!isDeleted,
            updated_at: updatedAt,
            device_id: DEVICE_ID
        };
    }

    // V3：按类型拉取重组
    function loadFromCloudV3(){
        if (!syncEnabled || !supabaseClient) return Promise.resolve(null);
        ensureSyncMeta();
        // 全量拉取（含 deleted=true 墓碑行）：墓碑行用于区分"云端该类型从未上传过"
        // 与"云端该类型数据全部已被删除"——前者需用本地数据补种上传，后者必须以云端为准清空本地
        return supabaseClient.from('sync_store').select('record_type,record_id,data,deleted,updated_at,device_id').then(function(res){
            if(res.error){
                console.error('[V3] 拉取失败:', res.error.message);
                return null;
            }
            var rows = res.data || [];
            console.log('[V3] 拉取到 ' + rows.length + ' 条行（含墓碑）');
            // 按 type 分组
            var byType = {};
            rows.forEach(function(r){
                if(!byType[r.record_type]) byType[r.record_type] = [];
                byType[r.record_type].push(r);
            });
            var result = { added:0, updated:0, removed:0, basicChanged:false, total:rows.length };
            // 先处理基础数据类型（云端覆盖本地）
            V3_BASIC_TYPES.forEach(function(type){
                var typeRows = byType[type] || [];
                // 仅未删除的有效行参与覆盖
                var cloudRows = typeRows.filter(function(r){ return r && !r.deleted; });
                var meta = V3_RECORD_TYPES.find(function(m){ return m.type === type; });
                if(!meta) return;
                var before = v3Snapshot(type);
                if(type === 'meta'){
                    // meta 类型：提取 dormitoryList 和 nextIds
                    var liveMeta = cloudRows.length > 0 ? cloudRows[0] : null;
                    if(liveMeta && liveMeta.data){
                        var md = liveMeta.data;
                        if(md.dormitoryList) DB.dormitoryList = md.dormitoryList;
                        if(md.nextIds) DB.nextIds = Object.assign(DB.nextIds || {}, md.nextIds);
                    } else if(typeRows.length === 0){
                        // 云端缺失 meta 行：保留本地，标记脏后上传补种
                        v3MarkDirty('meta', 'main');
                    }
                } else if(type === 'deduction_item'){
                    if(typeRows.length === 0){
                        // 云端完全缺失该类型：保留本地数据并标记脏上传补种
                        // （旧逻辑无条件清空会导致扣分项目丢失）
                        v3MarkTypeDirty(type);
                    } else {
                        // 重置 deductionItems 为空对象，用云端有效行重建
                        DB.deductionItems = { hygiene: [], discipline: [] };
                        cloudRows.forEach(function(r){
                            if(r.data && r.data._subType){
                                v3RestoreDeductionItem(r);
                            } else {
                                // 旧格式没有 _subType，猜一下类型
                                var guess = (r.data && r.data.defaultScore <= 0.5) ? 'hygiene' : 'discipline';
                                DB.deductionItems[guess].push(r.data);
                            }
                        });
                    }
                } else if(typeRows.length === 0){
                    // 云端完全缺失该类型（如其他设备迁移中断/旧 bug 已把云端清空）：
                    // 保留本地数据，标记脏后上传补种，其他设备拉取即可自动恢复
                    // （旧逻辑无条件置空会清空楼层/宿舍/学生等基础数据，且此后永远无法再上传）
                    var seeded = v3MarkTypeDirty(type);
                    if(seeded > 0) console.log('[V3] 云端缺失 ' + type + ' 数据，保留本地 ' + seeded + ' 条并等待补种上传');
                } else {
                    // 普通数组类型：以云端有效行为准覆盖
                    DB[meta.dbPath[0]] = cloudRows.map(function(r){ return r.data; });
                }
                var after = v3Snapshot(type);
                if(before !== after) result.basicChanged = true;
            });
            // 再处理业务记录类型（按 updated_at 合并）
            V3_MUTABLE_TYPES.forEach(function(type){
                var cloudRows = (byType[type] || []).filter(function(r){ return r && !r.deleted; });
                var meta = V3_RECORD_TYPES.find(function(m){ return m.type === type; });
                if(!meta) return;
                var cloudMap = {};
                cloudRows.forEach(function(r){ cloudMap[r.record_id] = r; });
                var dirtySet = (DB.dirtyByType && DB.dirtyByType[type]) || {};
                var deletedSet = (DB.deletedByType && DB.deletedByType[type]) || {};
                // 本地按 record_id 建索引
                var localArr = DB[meta.dbPath[0]] || [];
                var localMap = {};
                localArr.forEach(function(r){ if(r && r.id!=null) localMap[String(r.id)] = r; });
                // 1) 云端有而本地没有 → 新增
                Object.keys(cloudMap).forEach(function(rid){
                    if(!localMap[rid] && !deletedSet[rid]){
                        localArr.push(cloudMap[rid].data);
                        localMap[rid] = cloudMap[rid].data;
                        result.added++;
                    }
                });
                // 2) 同 id 合并：本地非脏 → 以云端 updated_at 较新的为准
                Object.keys(cloudMap).forEach(function(rid){
                    if(!localMap[rid]) return;
                    if(dirtySet[rid] || deletedSet[rid]) return; // 本地脏或已删，保留本地
                    var local = localMap[rid];
                    var cloud = cloudMap[rid].data;
                    var localTime = local.lastModified || local.createdAt || 0;
                    var cloudTime = (cloudMap[rid].updated_at) ? new Date(cloudMap[rid].updated_at).getTime() : (cloud.lastModified || cloud.createdAt || 0);
                    if(cloudTime >= localTime && JSON.stringify(local) !== JSON.stringify(cloud)){
                        // 云端更新，保留本地 createdAt 等不应被覆盖的字段
                        Object.keys(local).forEach(function(k){ delete local[k]; });
                        Object.keys(cloud).forEach(function(k){ local[k] = cloud[k]; });
                        result.updated++;
                    }
                });
                // 3) 本地有而云端没有 → 本地脏保留；非脏视为被删除，清理
                var cloudIdSet = {};
                Object.keys(cloudMap).forEach(function(k){ cloudIdSet[k] = true; });
                var newLocalArr = localArr.filter(function(r){
                    var rid = String(r.id);
                    if(cloudIdSet[rid]) return true;
                    if(dirtySet[rid] || deletedSet[rid]) return true; // 本地脏/已删标记 → 保留
                    return false; // 云端没有且本地不脏 → 被其他设备删除了
                });
                result.removed += (localArr.length - newLocalArr.length);
                DB[meta.dbPath[0]] = newLocalArr;
            });
            DB.lastSyncTime = Date.now();
            // 基础数据覆盖后重新校准账号
            ensureCorrectUsers();
            if(currentUser && currentUser.id != null){
                var refreshed = DB.users.find(function(x){ return String(x.id) === String(currentUser.id); });
                if(refreshed) currentUser = refreshed;
            }
            if(selectedDormitoryId && !getDormitoryById(selectedDormitoryId)){ selectedDormitoryId=null; selectedFloorId=null; }
            console.log('[V3] 拉取完成：新增 '+result.added+'，更新 '+result.updated+'，清理 '+result.removed+'，基础数据变化='+result.basicChanged+'，云端共 '+result.total+' 行');
            return result;
        });
    }
    // 辅助：取某类型数组的 JSON 快照（用于比较是否变化）
    function v3Snapshot(type){
        try {
            var meta = V3_RECORD_TYPES.find(function(m){ return m.type === type; });
            if(!meta) return '';
            if(type === 'meta') return JSON.stringify({ dormitoryList: DB.dormitoryList || [], nextIds: DB.nextIds || {} });
            if(type === 'deduction_item') return JSON.stringify(DB.deductionItems || {});
            return JSON.stringify(DB[meta.dbPath[0]] || []);
        } catch(e){ return ''; }
    }

    // 将旧格式（sync_store 中 id=1 的压缩/整库行）迁移为 V3 按行格式
    function migrateOldFormatToRows(){
        if(!supabaseClient) return Promise.resolve(false);
        // 先查询是否有旧格式数据（id=1，data 非 null）
        return supabaseClient.from('sync_store').select('id,data').eq('id',1).maybeSingle().then(function(res){
            if(res.error){ console.error('[迁移] 查询旧数据失败:', res.error.message); return false; }
            if(!res.data || res.data.data == null){ console.log('[迁移] 云端无旧格式数据，跳过'); return false; }
            var decoded = decodeCloudData(res.data.data);
            if(!decoded || typeof decoded !== 'object'){
                console.log('[迁移] 旧数据无法解析，跳过');
                return false;
            }
            // 构建完整的 DB 对象（从旧数据提取）
            var full = {
                floors: decoded.floors || [],
                dormitories: decoded.dormitories || [],
                students: decoded.students || [],
                users: decoded.users || [],
                deductionRecords: decoded.deductionRecords || [],
                leaveRecords: decoded.leaveRecords || [],
                absenceRecords: decoded.absenceRecords || []
            };
            // deductionItems 可能在旧数据中不存在
            if(decoded.deductionItems) full.deductionItems = decoded.deductionItems;
            else full.deductionItems = { hygiene:[], discipline:[] };
            // 将每条业务记录构造为 sync_store 行
            var allRows = [];
            var nowIso = new Date().toISOString();
            // floor / dormitory / student / user：直接转
            ['floors','dormitories','students','users'].forEach(function(arrKey){
                var typeMap = { floors:'floor', dormitories:'dormitory', students:'student', users:'user' };
                var records = full[arrKey] || [];
                records.forEach(function(rec){
                    if(!rec || rec.id == null) return;
                    allRows.push(v3BuildUpsertRow(typeMap[arrKey], rec.id, rec, false, nowIso));
                });
            });
            // deductionItems 特殊处理
            ['hygiene','discipline'].forEach(function(sub){
                var items = (full.deductionItems && full.deductionItems[sub]) || [];
                items.forEach(function(item){
                    if(!item || item.id == null) return;
                    var enriched = Object.assign({}, item, { _subType: sub });
                    allRows.push(v3BuildUpsertRow('deduction_item', item.id, enriched, false, nowIso));
                });
            });
            // 业务记录：deduction_record / leave_record / absence_record
            var bizMap = { deductionRecords:'deduction_record', leaveRecords:'leave_record', absenceRecords:'absence_record' };
            ['deductionRecords','leaveRecords','absenceRecords'].forEach(function(arrKey){
                var records = full[arrKey] || [];
                records.forEach(function(rec){
                    if(!rec || rec.id == null) return;
                    allRows.push(v3BuildUpsertRow(bizMap[arrKey], rec.id, rec, false, nowIso));
                });
            });
            if(allRows.length === 0){ console.log('[迁移] 旧数据无有效记录，跳过'); return false; }
            console.log('[迁移] 准备迁移 ' + allRows.length + ' 条记录...');
            // 先删后插
            function uploadOne(row){
                return supabaseClient.from('sync_store')
                    .delete()
                    .eq('record_type', row.record_type)
                    .eq('record_id', row.record_id)
                    .then(function(){
                        return supabaseClient.from('sync_store').insert([row]);
                    });
            }
            function doBatch(startIdx){
                if(startIdx >= allRows.length){
                    return supabaseClient.from('sync_store').delete().eq('id',1).then(function(r2){
                        if(r2.error) console.warn('[迁移] 清理旧行失败（可忽略）:', r2.error.message);
                        else console.log('[迁移] 旧格式行已删除');
                        return true;
                    });
                }
                var chunk = allRows.slice(startIdx, startIdx + V3_UPSERT_CHUNK);
                return Promise.all(chunk.map(uploadOne)).then(function(results){
                    var fail = results.find(function(r){ return r.error; });
                    if(fail){ console.error('[迁移] 批次失败:', fail.error.message); return false; }
                    return doBatch(startIdx + V3_UPSERT_CHUNK);
                });
            }
            return doBatch(0).then(function(ok){
                if(ok){ toast('数据格式升级完成'); }
                return ok;
            });
        });
    }

    // ==================== 云端数据编解码（向后兼容旧格式） ====================
    // 云端 data 字段为 jsonb：旧数据读回是对象，新压缩数据读回是带前缀的字符串
    function decodeCloudData(raw) {
        if (raw == null) return null;
        // 旧格式：jsonb 直接返回的对象
        if (typeof raw === 'object') return raw;
        if (typeof raw !== 'string') return null;
        var json = null;
        try {
            if (raw.indexOf(CLOUD_LZ_PREFIX) === 0) {
                // 新格式：Base64 压缩
                json = LZString.decompressFromBase64(raw.slice(CLOUD_LZ_PREFIX.length));
            } else if (raw.indexOf('LZC1U:') === 0) {
                json = LZString.decompressFromUTF16(raw.slice('LZC1U:'.length));
            } else if (raw.indexOf('LZC1:') === 0) {
                json = LZString.decompress(raw.slice('LZC1:'.length));
            } else {
                // 无前缀：先按未压缩 JSON 文本尝试（旧格式或直接字符串上传）
                try {
                    var parsed = JSON.parse(raw);
                    if (parsed && typeof parsed === 'object') return parsed;
                } catch(je) { /* 不是 JSON，按压缩串处理 */ }
                // 兼容不带标记的压缩串：依次尝试各解压变体
                var variants = ['decompress', 'decompressFromUTF16', 'decompressFromBase64', 'decompressFromEncodedURIComponent'];
                for (var i = 0; i < variants.length; i++) {
                    try {
                        var candidate = LZString[variants[i]](raw);
                        if (candidate) {
                            var obj = JSON.parse(candidate);
                            if (obj && typeof obj === 'object') return obj;
                        }
                    } catch(ve) { /* 尝试下一种变体 */ }
                }
                console.error('云端数据无法识别：既非有效 JSON 也非支持的压缩格式');
                return null;
            }
            if (!json) {
                console.error('云端压缩数据解压失败：返回空结果（数据可能已损坏）');
                return null;
            }
            return JSON.parse(json);
        } catch(e) {
            console.error('云端数据解码失败:', e);
            return null;
        }
    }
    // ==================== 双层同步：全量基础数据 + 增量扣分记录 ====================
    // 云端 data 字段存 version 2.0 全量对象（基础数据 + 扣分记录），压缩存储
    // 上传：基础表（楼层/宿舍/学生/项目/用户/退宿）以本地为准直接覆盖；扣分记录保持增量合并
    //（pending = 未同步 ∪ 本地修改过的脏记录，同 id 以本地为准，已删除记录通过墓碑剔除）
    // ==================== 同步状态指示器 + 断网重试 ====================
    function updateSyncStatus(state){
        var dot=document.getElementById('syncStatusDot');
        if(!dot) return;
        dot.classList.remove('synced','syncing','unsynced');
        dot.classList.add(state);
        var tips={synced:'已同步',syncing:'同步中…',unsynced:'有未同步数据（点击重试）'};
        dot.title='同步状态：'+(tips[state]||'');
    }
    // 重试状态：指数退避 5s→10s→20s→40s→60s（封顶），最多 5 次
    var _retryState={attempt:0, timer:null, running:false};
    function clearRetryTimer(){ if(_retryState.timer){ clearTimeout(_retryState.timer); _retryState.timer=null; } }
    function syncWithRetry(){
        if(!syncEnabled||!supabaseClient||!DB) return Promise.resolve(false);
        if(_retryState.running) return Promise.resolve(false); // 防重入
        _retryState.running=true;
        _retryState.attempt=0;
        clearRetryTimer();
        function doAttempt(){
            updateSyncStatus('syncing');
            // 离线：不立即重试，等 online 事件触发
            if(typeof navigator!=='undefined' && navigator.onLine===false){
                updateSyncStatus('unsynced');
                _retryState.running=false;
                return Promise.resolve(false);
            }
            return syncToCloud().then(function(ok){
                if(ok){
                    updateSyncStatus('synced');
                    _retryState.attempt=0;
                    _retryState.running=false;
                    return true;
                }
                // 失败：指数退避重试
                _retryState.attempt++;
                if(_retryState.attempt>=5){
                    updateSyncStatus('unsynced');
                    _retryState.running=false;
                    return false;
                }
                var delay=Math.min(60000, 5000*Math.pow(2, _retryState.attempt-1));
                updateSyncStatus('unsynced');
                _retryState.timer=setTimeout(function(){ doAttempt(); }, delay);
                return false;
            }).catch(function(){
                _retryState.attempt++;
                if(_retryState.attempt>=5){
                    updateSyncStatus('unsynced');
                    _retryState.running=false;
                    return false;
                }
                var delay=Math.min(60000, 5000*Math.pow(2, _retryState.attempt-1));
                updateSyncStatus('unsynced');
                _retryState.timer=setTimeout(function(){ doAttempt(); }, delay);
                return false;
            });
        }
        return doAttempt();
    }
    function syncToCloud() {
        if (!syncEnabled || !supabaseClient || !DB) return Promise.resolve(false);
        ensureSyncMeta();
        // V3 按行存储：表结构已升级时自动切换
        if(_detectedSchemaVersion === 3) return syncToCloudV3();
        var pending=DB.deductionRecords.filter(function(r){
            var k=String(r.id);
            return DB.syncedRecordIds.indexOf(k)===-1 || DB.dirtyRecordIds.indexOf(k)>-1;
        });
        return supabaseClient.from('sync_store').select('data').eq('id',1).maybeSingle().then(function(res){
            if (res.error) { console.error('上传失败（读取云端）:', res.error.message); return false; }
            var cloudRecords=[];
            if (res.data && res.data.data!=null) {
                var decoded=decodeCloudData(res.data.data);
                if (decoded) {
                    if (Array.isArray(decoded)) cloudRecords=decoded;                                    // v1 增量格式：纯记录数组
                    else if (decoded.deductionRecords) cloudRecords=decoded.deductionRecords;            // v1 旧整库 / v2.0 全量：提取记录
                }
            }
            // 扣分记录合并去重（按 id 唯一）：
            // 基数 = 云端现有记录（权威） ∪ 本地 pending 记录（新增或脏）
            // 同 id 按 lastModified 取较新版本；本地已删除的记录通过墓碑剔除
            // 注意：已同步且非脏的本地记录不参与合并，避免本地旧编辑回灌云端
            var byId={};
            cloudRecords.forEach(function(r){ if(r&&r.id!=null) byId[String(r.id)]=r; });
            pending.forEach(function(r){
                if(!r||r.id==null) return;
                var k=String(r.id);
                var cur=byId[k];
                if(!cur || (r.lastModified||0) >= (cur.lastModified||0)) byId[k]=r;
            });
            var tomb={}; DB.deletedRecordIds.forEach(function(id){ tomb[String(id)]=true; });
            var merged=Object.keys(byId).filter(function(k){ return !tomb[k]; }).map(function(k){ return byId[k]; });
            // 构建 v2.0 全量载荷：基础数据以本地为准
            var payload = {
                floors: DB.floors,
                dormitories: DB.dormitories,
                dormitoryList: DB.dormitoryList || [],
                students: DB.students,
                deductionItems: DB.deductionItems,
                users: DB.users,
                deductionRecords: merged,
                leaveRecords: DB.leaveRecords || [],
                absenceRecords: DB.absenceRecords || [],
                lastModified: Date.now(),
                version: '2.0'
            };
            var body;
            try {
                if (window.LZString && typeof LZString.compressToBase64 === 'function') {
                    // 压缩为 Base64（纯 ASCII）：HTTP/UTF-8 传输无字符膨胀，且 jsonb 存储安全
                    body = CLOUD_LZ_PREFIX + LZString.compressToBase64(JSON.stringify(payload));
                } else {
                    throw new Error('lz-string 未加载');
                }
            } catch(e) {
                // 压缩失败回退：直接上传 JSON 对象
                console.warn('数据压缩失败，回退为原始格式上传:', e);
                body = payload;
            }
            return supabaseClient.from('sync_store').upsert({ id:1, data: body, updated_at: new Date().toISOString() }).then(function(res2){
                if(res2.error){ console.error('上传失败:', res2.error.message); return false; }
                // 上传成功后才登记为已同步并清除脏标记；失败则下次自动重试
                pending.forEach(function(r){
                    var k=String(r.id);
                    if(DB.syncedRecordIds.indexOf(k)===-1) DB.syncedRecordIds.push(k);
                    var di=DB.dirtyRecordIds.indexOf(k);
                    if(di>-1) DB.dirtyRecordIds.splice(di,1);
                });
                DB.lastSyncTime=Date.now();
                saveDBToLocal();
                return true;
            });
        });
    }
    // 拉取合并策略：
    // - v2.0 全量格式：基础数据表（楼层/宿舍/学生/项目/用户）以云端为准直接覆盖本地；扣分记录增量合并
    // - 退宿/停宿/请假记录按 id 合并（见下方 merge 函数），防止其他设备刚完成的审核被云端旧状态回滚
    // - v1 数组 / 旧整库：仅提取扣分记录增量合并（向后兼容）
    // - 首次同步（lastSyncTime 为空）：清空本地示例记录与同步元数据，云端数据完整落地
    // - 记录合并规则：本地缺失→追加；本地修改过（脏）→保留本地；其余按 lastModified 接收云端更新；墓碑不回灌
    // 退宿/停宿记录合并：
    // 1) 以 id 为键取并集：云端有而本地无 → 追加；本地有而云端无 → 仅保留带 localNew 标记的
    //    本地新增记录（未及上传），其余视为已在其他设备删除，随拉取传播删除；
    // 2) 同 id 记录合并审核状态：本地 pending 且云端已审核 → 采纳云端（其他设备管理员已审核）；
    //    本地已审核且云端 pending → 保留本地（防止本设备刚完成的审核被回滚）；同态 → 以云端为准。
    function mergeLeaveRecordArrays(localArr, remoteArr){
        var remote=(remoteArr||[]).filter(function(r){ return r&&r.id!=null; });
        var remoteIds={};
        remote.forEach(function(r){ remoteIds[String(r.id)]=true; });
        var byId={};
        (localArr||[]).forEach(function(r){
            if(!r||r.id==null) return;
            var k=String(r.id);
            if(remoteIds[k]){
                delete r.localNew;
                var rr=remote.find(function(x){ return String(x.id)===k; });
                var ls=r.status||'pending', rs=rr.status||'pending';
                if(ls==='pending' && rs!=='pending'){ r.status=rs; }
                else if(ls!=='pending' && rs==='pending'){ /* 保留本地已审核状态 */ }
                else { r.status=rs; }
                byId[k]=r;
            } else if(r.localNew){
                byId[k]=r;
            }
        });
        remote.forEach(function(r){
            var k=String(r.id);
            if(!byId[k]){ byId[k]=r; }
        });
        return Object.keys(byId).map(function(k){ return byId[k]; });
    }
    // 请假记录合并：无审核状态流转，规则同上（并集 + localNew 对账）
    function mergeAbsenceRecordArrays(localArr, remoteArr){
        var remote=(remoteArr||[]).filter(function(r){ return r&&r.id!=null; });
        var remoteIds={};
        remote.forEach(function(r){ remoteIds[String(r.id)]=true; });
        var byId={};
        (localArr||[]).forEach(function(r){
            if(!r||r.id==null) return;
            var k=String(r.id);
            if(remoteIds[k]){ delete r.localNew; byId[k]=r; }
            else if(r.localNew){ byId[k]=r; }
        });
        remote.forEach(function(r){
            var k=String(r.id);
            if(!byId[k]){ byId[k]=r; }
        });
        return Object.keys(byId).map(function(k){ return byId[k]; });
    }
    function loadFromCloud() {
        if (!syncEnabled || !supabaseClient) return Promise.resolve(null);
        // V3 按行存储：表结构已升级时自动切换
        if(_detectedSchemaVersion === 3) return loadFromCloudV3();
        return supabaseClient.from('sync_store').select('data').eq('id',1).maybeSingle().then(function(res){
            if (res.error) { console.error('拉取失败:', res.error.message); return null; }
            if (!res.data || res.data.data == null) return null;
            var decoded = decodeCloudData(res.data.data);
            if (!decoded) { console.error('云端数据解码结果为空，已忽略'); return null; }
            var cloudRecords = Array.isArray(decoded) ? decoded : (decoded.deductionRecords || null);
            if (!cloudRecords) { console.error('云端数据格式无法识别，已忽略'); return null; }
            ensureSyncMeta();
            var isV2 = !Array.isArray(decoded) && decoded.version === '2.0';
            var isFirst = !DB.lastSyncTime;
            var result = { added: 0, updated: 0, total: cloudRecords.length, basicChanged: false };
            // 基础数据表：v2.0 时以云端为准覆盖本地（管理员统一维护，云端为权威来源）
            // 退宿/停宿/请假记录例外：按 id 合并（整体覆盖会把其他设备刚完成的审核状态回滚为待审核）
            if (isV2) {
                var before = JSON.stringify([DB.floors, DB.dormitories, DB.dormitoryList || [], DB.students, DB.deductionItems, DB.users, DB.leaveRecords || [], DB.absenceRecords || []]);
                DB.floors = decoded.floors || DB.floors;
                DB.dormitories = decoded.dormitories || DB.dormitories;
                // dormitoryList：系统生效宿舍号列表，以云端为准覆盖（管理员增删宿舍号需同步到所有设备）
                DB.dormitoryList = Array.isArray(decoded.dormitoryList) ? decoded.dormitoryList : (DB.dormitoryList || []);
                DB.students = decoded.students || DB.students;
                DB.deductionItems = decoded.deductionItems || DB.deductionItems;
                DB.users = decoded.users || DB.users;
                DB.leaveRecords = mergeLeaveRecordArrays(DB.leaveRecords || [], decoded.leaveRecords || []);
                DB.absenceRecords = mergeAbsenceRecordArrays(DB.absenceRecords || [], decoded.absenceRecords || []);
                var after = JSON.stringify([DB.floors, DB.dormitories, DB.dormitoryList, DB.students, DB.deductionItems, DB.users, DB.leaveRecords, DB.absenceRecords]);
                result.basicChanged = before !== after;
                // 云端基础数据覆盖后重新校准账号（角色修正/补齐班级账号/称呼迁移），
                // 避免云端旧数据把 realName 回滚为旧称呼
                ensureCorrectUsers();
                if (currentUser && currentUser.id != null) {
                    var refreshedUser = DB.users.find(function(x){ return String(x.id) === String(currentUser.id); });
                    if (refreshedUser) currentUser = refreshedUser;
                }
            }
            // 首次同步：丢弃本地示例记录与同步元数据，云端记录完整落地
            if (isFirst) {
                DB.deductionRecords = [];
                DB.syncedRecordIds = [];
                DB.dirtyRecordIds = [];
                DB.deletedRecordIds = [];
            }
            var tomb={}; DB.deletedRecordIds.forEach(function(id){ tomb[String(id)]=true; });
            var dirty={}; DB.dirtyRecordIds.forEach(function(id){ dirty[String(id)]=true; });
            var localIds={};
            DB.deductionRecords.forEach(function(r){ localIds[String(r.id)]=r; });
            cloudRecords.forEach(function(r){
                if(!r||r.id==null) return;
                var k=String(r.id);
                if(tomb[k]) return;      // 本地已删除的记录不回灌
                if(dirty[k]) return;     // 本地有未上传的修改：以本地为准，不被云端覆盖
                if(!localIds[k]){
                    DB.deductionRecords.push(r);
                    localIds[k]=r;
                    result.added++;
                }else{
                    // 本地存在但未编辑过：接收其他设备的修改（按 lastModified 判定新旧）
                    var cur=localIds[k];
                    var ra=r.lastModified||0, ca=cur.lastModified||0;
                    if(ra>ca && JSON.stringify(cur)!==JSON.stringify(r)){
                        Object.keys(cur).forEach(function(f){ delete cur[f]; });
                        Object.keys(r).forEach(function(f){ cur[f]=r[f]; });
                        result.updated++;
                    }
                }
            });
            // 已同步集合 = 原有 ∪ 云端全部记录ID（下次上传不再重复推送云端已有且未修改的记录）
            cloudRecords.forEach(function(r){
                if(!r||r.id==null) return;
                var k=String(r.id);
                if(!tomb[k] && DB.syncedRecordIds.indexOf(k)===-1) DB.syncedRecordIds.push(k);
            });
            // 终局对账（v2.0）：删除本地存在但云端已不存在、且非本地脏编辑的记录。
            // 用于将管理员"删除全部/单条删除"的操作传播到其他设备，避免本地残留旧数据。
            if (isV2) {
                var cloudIdSet={};
                cloudRecords.forEach(function(r){ if(r&&r.id!=null) cloudIdSet[String(r.id)]=true; });
                var beforeLen=DB.deductionRecords.length;
                DB.deductionRecords=DB.deductionRecords.filter(function(r){
                    var k=String(r.id);
                    if(cloudIdSet[k]) return true;          // 云端存在，保留
                    if(dirty[k]) return true;               // 本地有未上传修改，保留（避免丢失本地编辑）
                    if(tomb[k]) return false;               // 墓碑，删除
                    return false;                           // 云端已删除，本地清理
                });
                result.removed = beforeLen - DB.deductionRecords.length;
            }
            // 云端优先策略：v2.0 且本地从未同步过（首次启动）时，强制以云端记录集合为权威，
            // 清空脏记录，防止本地示例/旧数据在后续 syncToCloud 中回灌云端
            if (isV2 && isFirst) {
                DB.syncedRecordIds = cloudRecords.map(function(r){ return String(r.id); });
                DB.dirtyRecordIds = [];
            }
            DB.lastSyncTime=Date.now();
            // 基础数据覆盖后校验当前选中引用是否失效
            if(selectedDormitoryId && !getDormitoryById(selectedDormitoryId)){ selectedDormitoryId=null; selectedFloorId=null; }
            console.log('云端拉取完成：新增 '+result.added+' 条，更新 '+result.updated+' 条，清理 '+result.removed+' 条，云端共 '+cloudRecords.length+' 条'+(isV2?'（v2.0 全量'+(result.basicChanged?'，基础数据已更新':'）'):''));
            result.cloudRecordIds = cloudRecords.map(function(r){ return String(r.id); });
            return result;
        });
    }
    function initializeData() {
        if (!loadDBFromLocal()) initDatabase();
        ensureCorrectUsers();
        ensureSyncMeta();
        // 基础数据自愈：修复本地被意外清空的楼层/宿舍（无论是否启用云端同步都要执行）
        if(repairBasicData()) saveDBToLocal();
        if (SUPABASE_CONFIG.enabled && SUPABASE_CONFIG.url.indexOf('YOUR_') === -1) {
            syncEnabled = true;
            try {
                supabaseClient = window.supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey);
                // 网络恢复时自动重试未完成的增量上传（走重试队列）
                window.addEventListener('online', function(){ if(syncEnabled&&supabaseClient&&DB){ ensureSyncMeta(); syncWithRetry(); } });
                // V3：检测表结构版本 + 旧数据迁移
                return detectV3Schema().then(function(ver){
                    if(ver === 3){
                        // 表结构已升级，尝试迁移旧格式数据
                        console.log('[V3] 表结构已是按行存储，尝试迁移旧格式数据...');
                        return migrateOldFormatToRows().then(function(migrated){
                            if(migrated){
                                console.log('[V3] 旧格式迁移完成，跳过本地脏标记');
                            } else {
                                // 没有旧数据可迁（云端原本就是空的）：把本地所有记录标记为脏
                                v3MarkAllLocalDirty();
                            }
                            return null;
                        });
                    }
                    console.log('[V3] 表结构未升级，使用 V2 同步（请手动执行 ALTER TABLE SQL）');
                    return null;
                }).then(function(){
                    return loadFromCloud();
                }).then(function(pullResult) {
                    // 基础数据自愈：无论云端拉取成功与否，先修复本地被意外清空的楼层/宿舍
                    // （修复产生的脏记录由下方 syncToCloud 自动补种上传）
                    if(repairBasicData()) saveDBToLocal();
                    if (pullResult) {
                        // 云端优先策略：拉取成功后强制以云端记录集合为权威。
                        // 将本地 syncedRecordIds 替换为云端全部记录ID，清空脏记录，
                        // 确保旧设备的本地旧记录（已同步/已编辑）不会被回灌到云端。
                        // 本地新增记录（不在云端）不在 syncedRecordIds 中，仍会正常上传。
                        if (pullResult.cloudRecordIds) {
                            DB.syncedRecordIds = pullResult.cloudRecordIds.slice();
                        }
                        DB.dirtyRecordIds = [];
                        DB.lastSyncTime = Date.now();
                        saveDBToLocal();
                        checkStorageWarning();
                        console.log('已合并云端数据（新增 '+pullResult.added+' 条，更新 '+pullResult.updated+' 条，清理 '+(pullResult.removed||0)+' 条'+(pullResult.basicChanged?'，基础数据已更新':'')+'，云端共 '+pullResult.total+' 条，云端优先策略已生效）');
                    } else {
                        console.log('云端暂无有效数据，上传本地数据');
                    }
                    // 若存在未同步的脏记录，启动重试队列上传
                    if(DB.dirtyRecordIds && DB.dirtyRecordIds.length>0){
                        updateSyncStatus('unsynced');
                        syncWithRetry();
                    } else {
                        updateSyncStatus('synced');
                        syncToCloud();
                    }
                    checkSavedLogin();
                });
            } catch(e) {
                console.error('SDK初始化失败', e);
                syncEnabled = false;
                checkSavedLogin();
            }
        } else {
            checkSavedLogin();
        }
        return Promise.resolve();
    }
    function saveDB() {
        saveDBToLocal();
        if (syncEnabled && supabaseClient) syncWithRetry();
    }
    // ==================== 手动同步（拉取+推送，含加载提示） ====================
    function manualSync(){
        if(!syncEnabled||!supabaseClient){toast('云端同步未启用','error');return;}
        // 离线提示：加入重试队列，网络恢复后自动上传
        if(typeof navigator!=='undefined' && navigator.onLine===false){
            toast('当前网络不可用，已加入重试队列，网络恢复后自动上传','error');
            updateSyncStatus('unsynced');
            syncWithRetry();
            return;
        }
        if(manualSync._busy) return;
        manualSync._busy=true;
        var btn=document.getElementById('manualSyncBtn');
        if(btn){btn.textContent='⏳';btn.disabled=true;}
        toast('正在同步...');
        // 先拉后推：V3 拉取时可能对云端缺失的类型补种本地脏记录，
        // 顺序执行可确保补种记录随本次推送一起上传（并发会因推送先收集/后清脏而丢失补种）
        loadFromCloud().then(function(pulled){
            return syncToCloud().then(function(pushed){ return [pulled, pushed]; });
        }).then(function(results){
            manualSync._busy=false;
            if(btn){btn.textContent='🔄';btn.disabled=false;}
            var pulled=results[0], pushed=results[1];
            if(pulled===null && pushed===false){
                updateSyncStatus('unsynced');
                toast('同步失败，已加入重试队列稍后自动上传','error');
                syncWithRetry();
                return;
            }
            var added=pulled?pulled.added:0;
            var updated=pulled?pulled.updated:0;
            var removed=pulled?pulled.removed:0;
            var basicChanged=pulled?pulled.basicChanged:false;
            var parts=[];
            if(added>0) parts.push('拉取新增 '+added+' 条');
            if(updated>0) parts.push('更新 '+updated+' 条');
            if(removed>0) parts.push('清理 '+removed+' 条');
            if(basicChanged) parts.push('基础数据已同步');
            updateSyncStatus('synced');
            toast(parts.length>0?('同步完成：'+parts.join('，')):'同步完成，数据已是最新');
            // 拉取到新数据时刷新当前视图与树形菜单
            if(added>0||updated>0||removed>0||basicChanged){ renderTree(); renderView(); }
        }).catch(function(e){
            manualSync._busy=false;
            if(btn){btn.textContent='🔄';btn.disabled=false;}
            console.error('手动同步失败:', e);
            updateSyncStatus('unsynced');
            var msg=(e&&e.message)?e.message:'网络异常';
            toast('同步失败（'+msg+'），已加入重试队列','error');
            syncWithRetry();
        });
    }

    // ==================== 字体缩放（仅STAFF移动端） ====================
    var FONT_SCALE_KEY='dorm_font_scale_staff';
    var FONT_BASE=14; // 基准字号 14px
    var FONT_MIN=100, FONT_MAX=160, FONT_STEP=5;

    function applyFontScale(scale){
        scale=Math.max(FONT_MIN,Math.min(FONT_MAX,scale));
        var newSize=FONT_BASE*scale/100;
        document.documentElement.style.fontSize=newSize+'px';
        var valEl=document.getElementById('fontScaleValue');
        if(valEl) valEl.textContent=scale+'%';
        return scale;
    }
    function adjustFont(delta){
        var current=getStoredFontScale();
        var newScale=applyFontScale(current+delta);
        localStorage.setItem(FONT_SCALE_KEY,newScale.toString());
    }
    function resetFont(){
        applyFontScale(100);
        localStorage.setItem(FONT_SCALE_KEY,'100');
    }
    function toggleFontPanel(){
        var panel=document.getElementById('fontScalePanel');
        if(panel) panel.classList.toggle('show');
    }
    function getStoredFontScale(){
        var v=parseInt(localStorage.getItem(FONT_SCALE_KEY));
        return (isNaN(v)||v<FONT_MIN||v>FONT_MAX)?100:v;
    }
    function loadFontScaleForStaff(){
        if(!currentUser||currentUser.role!=='STAFF') return;
        if(window.innerWidth>768) return;
        document.body.classList.add('staff-font-scale');

        applyFontScale(scale);
    }

    function buildTreeHtml(p, withTitle){

            if(classMode){
                rooms=rooms.filter(function(r){ return dormSet[r.id]; });

            var isOpen = (f.id === selectedFloorId);
            html+='<div class="tree-floor"><div class="tree-floor-header" onclick="toggleFloor('+f.id+',\''+p+'\')"><span id="'+p+'arrow-'+f.id+'">'+(isOpen?'▼':'▶')+'</span>📁 '+f.name+' <span class="badge-tag badge-danger">'+total+'分</span></div><div class="tree-rooms'+(isOpen?' open':'')+'" id="'+p+'rooms-'+f.id+'">';
            rooms.forEach(function(r){
                var score=getTotalScore(filterRecordsByClass(getRecordsByDormitory(r.id)));
                var isActive = (r.id === selectedDormitoryId);
                html+='<div class="tree-room'+(isActive?' active':'')+'" id="'+p+'tree-room-'+r.id+'" onclick="selectDormitory('+r.id+')">🚪 '+r.roomNumber+' <span class="badge-tag '+(score>10?'badge-danger':score>3?'badge-warning':'badge-primary')+'">'+score+'分</span></div>';
