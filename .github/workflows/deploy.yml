name: Deploy to GitHub Pages

# 触发：推送到 master，或在 Actions 页面手动运行
on:
  push:
    branches: [ master ]
  workflow_dispatch:

# Actions 部署 Pages 所需的最小权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，新推送取消进行中的旧部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 关键：在构建产物里生成 access-key.local.js，
      # 口令来自 GitHub 加密 Secret（DORM_ACCESS_KEY），永不进入仓库/git 历史。
      - name: Inject access key (from secret, never in repo)
        run: |
          cat > access-key.local.js <<'EOF'
          // Auto-generated by GitHub Actions at deploy time. DO NOT COMMIT the real key.
          window.__DORM_ACCESS_KEY__ = '${{ secrets.DORM_ACCESS_KEY }}';
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
